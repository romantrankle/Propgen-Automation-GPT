[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "propgen-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "typer>=0.15,<1", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
propgen = "propgen.cli:app"
[tool.setuptools.package-data]
propgen = ["openapi.yaml"]
[tool.ruff]
line-length = 100
