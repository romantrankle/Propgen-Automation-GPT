  /template_capabilities:
    get:
      summary: Discover template input capabilities
      description: |
        Requires at least one of `text_snippets.add`, `landingpage_templates.add`, or `letter_templates.add`.
        Returns the accepted enum values for all three template POST contracts from the same application constants
        used by request validation. The `schema_version` changes only for breaking response-shape changes.
      tags: [Text snippets, Landing page templates, Letter templates]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '200':
          description: Machine-readable template input capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateCapabilitiesResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing every supported template add scope }
  /letter_templates:
    get:
      summary: List letter templates
      description: Requires `letter_templates.list`.
      tags: [Letter templates]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '200':
          description: Shop-scoped letter templates
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LetterTemplate' } }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing letter_templates.list scope }
    post:
      summary: Create a letter template
      description: |
        Requires `letter_templates.add`. The uploaded file must be a structurally valid DOCX. Validation errors use
        the public request fields and English messages; missing `name` and `file` are reported together. Invalid enum
        values return their accepted values under `allowed_values`. Unsafe or unsupported merge commands return
        `invalid_merge_template` with the exact expression and its location in the DOCX. Discover current enum values
        with `/template_capabilities`.
      tags: [Letter templates]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: { type: string }
                file: { type: string, format: binary }
                category: { type: string, enum: [property_expose, letter, contract, report, other] }
                model: { type: string, enum: [property, contact, company], description: Persisted generation context; defaults category to property_expose for property and letter otherwise. }
                description: { type: string }
                active: { type: boolean }
                position: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Created template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LetterTemplateResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing letter_templates.add scope }
        '422':
