          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, booking_page_id, calendar_event_id, contact_id, property_id, status, slot_start, slot_end]
                    properties:
                      id: { type: integer }
                      booking_page_id: { type: integer }
                      calendar_event_id: { type: integer, description: 'For mass viewings, the shared session calendar event ID' }
                      contact_id: { type: integer }
                      property_id: { type: integer, nullable: true }
                      status: { type: string, enum: [confirmed] }
                      slot_start: { type: string, format: date-time }
                      slot_end: { type: string, format: date-time }
        '401':
          description: Missing or invalid API key
        '403':
          description: Missing scope or IP not allowed
        '404':
          description: Booking page or contact not found in the API key's shop
        '422':
          description: '`invalid_payload`, `booking_page_inactive`, `slot_unavailable`, or `validation_failed` with field errors'
        '429':
          description: API key rate limit exceeded
        '503':
          description: '`availability_unavailable`; availability could not be calculated'
