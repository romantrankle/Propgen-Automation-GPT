        '403': { description: Missing form_definitions.read scope }
  /form_definitions/{model}:
    parameters:
      - in: path
        name: model
        required: true
        schema: { type: string, enum: [properties, contacts, companies, leases, notes] }
      - in: query
        name: category_key
        required: false
        schema: { type: string, pattern: '^[a-z0-9]+(?:[_-][a-z0-9]+)*$' }
        description: For `model=notes`, omit this parameter to manage the shop-global field catalog, or provide a stable key from `/note_labels` to manage one category form.
    get:
      summary: Read the effective form definition
      description: Requires `form_definitions.read`. For notes, omitting `category_key` returns the shop-global field catalog; providing it selects one category-owned layout that references those global definitions. Returns the canonical writable custom fields and customizations together with the fully resolved, effective read view in `effective_schema`. Visibility settings control presentation, not authorization. Returns a strong ETag.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '200':
          description: Form definition
          headers:
            ETag: { schema: { type: string }, description: Strong configuration version }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinition' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.read scope }
        '422':
          description: Unsupported model; includes the allowed model keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionUnsupportedModel' }
    put:
      summary: Atomically apply a form definition candidate
      description: Requires `form_definitions.edit` and the current strong ETag in `If-Match`. For notes, omit `category_key` to replace global field definitions (with empty customizations), or provide it to replace one category layout using exact global field definitions. Existing custom fields cannot be omitted, renamed, deleted, or have type/source or provider metadata changed. Configuration is committed even if an Elasticsearch mapping sync fails; retry the same request body using the ETag returned by the successful 200 response as the new `If-Match` value to converge mappings.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinitionCandidateInput' }
      responses:
        '200':
          description: Applied definition; warnings and mapping_errors report eventual mapping-sync failures
          headers:
            ETag: { schema: { type: string }, description: Strong configuration version }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionApplyResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '400': { description: Malformed request body }
        '412':
          description: ETag mismatch; fetch definition_url and retry with current_etag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionEtagMismatch' }
        '422': { description: Field-addressed candidate validation errors }
        '428': { description: If-Match is required }
    patch:
      summary: Atomically apply form-definition operations
      description: Requires `form_definitions.edit` and the current strong ETag in `If-Match`. The request is an operations envelope; all operations are validated and applied atomically.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinitionOperationsEnvelope' }
      responses:
        '200':
          description: Applied effective definition
          headers:
            ETag: { schema: { type: string }, description: Strong configuration version }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionApplyResponse' }
        '400': { description: Malformed request body }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '412':
          description: ETag mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionEtagMismatch' }
        '422': { description: Invalid operations or unsupported model }
        '428': { description: If-Match is required }
  /form_definitions/{model}/validate:
    post:
      summary: Validate a form definition candidate without mutation
      description: Requires `form_definitions.edit`. Returns normalization, warnings, field-addressed errors, and a semantic diff.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: model
          required: true
          schema: { type: string, enum: [properties, contacts, companies, leases, notes] }
        - in: query
          name: category_key
          required: false
          schema: { type: string, pattern: '^[a-z0-9]+(?:[_-][a-z0-9]+)*$' }
          description: Optional for `model=notes`; omit for the global field catalog or provide a stable category key for one category layout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinitionCandidateInput' }
      responses:
        '200':
          description: Valid candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionValidationResult' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '400': { description: Malformed request body }
        '422':
          description: Invalid candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionValidationFailure' }
  /form_definitions/{model}/operations/validate:
    post:
      summary: Validate form-definition operations without mutation
      description: Requires `form_definitions.edit`. Applies the operations to the current canonical definition in memory and returns its normalized candidate, errors, warnings, and semantic diff without changing the ETag.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - in: path
          name: model
          required: true
          schema: { type: string, enum: [properties, contacts, companies, leases, notes] }
        - in: query
          name: category_key
          required: false
          schema: { type: string, pattern: '^[a-z0-9]+(?:[_-][a-z0-9]+)*$' }
          description: Optional for `model=notes`; omit for the global field catalog or provide a stable category key for one category layout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinitionOperationsEnvelope' }
      responses:
        '200':
          description: Valid operations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionValidationResult' }
        '400': { description: Malformed request body }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '422':
          description: Invalid operations or unsupported model
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FormDefinitionValidationFailure'
                  - $ref: '#/components/schemas/FormDefinitionUnsupportedModel'
  /form_definitions/{model}/customizations:
    delete:
      summary: Reset all canonical customizations
      description: Requires `form_definitions.edit` and the current strong ETag. Custom fields are retained; only customizations are removed.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { in: path, name: model, required: true, schema: { type: string, enum: [properties, contacts, companies, leases, notes] } }
        - { in: query, name: category_key, required: false, description: 'Required only when resetting one note category layout.', schema: { type: string, pattern: '^[a-z0-9]+(?:[_-][a-z0-9]+)*$' } }
        - { in: header, name: If-Match, required: true, schema: { type: string } }
      responses:
        '200':
          description: Effective definition after reset
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionApplyResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '412': { description: ETag mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionEtagMismatch' } } } }
        '422': { description: Unsupported model or legacy configuration requiring migration }
        '428': { description: If-Match is required }
  /form_definitions/{model}/custom_fields:
    parameters:
      - { in: path, name: model, required: true, schema: { type: string, enum: [properties, contacts, companies, leases, notes] } }
    get:
      summary: List canonical custom fields
      description: Requires `form_definitions.read`. For notes this endpoint is shop-global and does not accept `category_key`. Returns custom fields only, not fields inherited into the effective schema.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '200':
          description: Custom fields
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormDefinitionCustomFieldCollection' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.read scope }
        '400': { description: category_key is not supported by the global custom-field catalog }
        '422': { description: Unsupported model }
    post:
      summary: Create or upsert a custom field
      description: >-
        Requires `form_definitions.edit` and the current strong ETag. Accepts either
        `{ custom_field: field }` or the field object directly. Note field definitions are
        always shop-global; do not send `category_key`.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { in: header, name: If-Match, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/FormDefinitionCustomFieldInput'
                - type: object
                  required: [custom_field]
                  properties:
                    custom_field: { $ref: '#/components/schemas/FormDefinitionCustomFieldInput' }
      responses:
        '200': { description: Effective definition after upsert, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionApplyResponse' } } } }
        '400': { description: category_key is not supported by the global custom-field catalog }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '412': { description: ETag mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionEtagMismatch' } } } }
        '422': { description: Field validation errors or unsupported model }
        '428': { description: If-Match is required }
  /form_definitions/{model}/custom_fields/{field}:
    parameters:
      - { in: path, name: model, required: true, schema: { type: string, enum: [properties, contacts, companies, leases, notes] } }
      - { in: path, name: field, required: true, schema: { type: string, pattern: '^custom_[a-z0-9_]+$' } }
      - { in: header, name: If-Match, required: true, schema: { type: string } }
    patch:
      summary: Upsert a custom field at a stable field key
      description: Requires `form_definitions.edit`. The path field overrides any `field` value in the direct or wrapped request body.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinitionCustomFieldInput' }
      responses:
        '200': { description: Effective definition after upsert, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionApplyResponse' } } } }
        '400': { description: category_key is not supported by the global custom-field catalog }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '412': { description: ETag mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionEtagMismatch' } } } }
        '422': { description: Field validation errors or unsupported model }
        '428': { description: If-Match is required }
    delete:
      summary: Delete a custom field
      description: >-
        Requires `form_definitions.edit`. Deletion is idempotent and removes the deleted field's own
        assignment, override, and hidden-field entries. It fails validation while another definition
        dynamically references the field or while records still contain values. Use this dedicated
        endpoint instead of omitting an existing field from a PUT candidate.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '200': { description: Effective definition after deletion, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionApplyResponse' } } } }
        '400': { description: category_key is not supported by the global custom-field catalog }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '412': { description: ETag mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionEtagMismatch' } } } }
        '422': { description: Field has stored values, is dynamically referenced, or the model is unsupported }
        '428': { description: If-Match is required }
  /form_definitions/{model}/field_tags:
    parameters:
      - { in: path, name: model, required: true, schema: { type: string, enum: [properties, contacts, companies, notes] } }
    get:
      summary: List field tags for the model
      description: Requires `form_definitions.read`. Results are shop- and model-scoped and ordered by name.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '200': { description: Field tags, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionFieldTagCollection' } } } }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.read scope }
        '422': { description: Unsupported model }
    post:
      summary: Create a field tag
      description: >-
        Requires `form_definitions.edit`. Accepts either `{ field_tag: tag }` or the tag object
        directly. Missing color defaults to `#64748B`; category_name is created when needed and
        defaults to `Allgemein`.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinitionFieldTagInput' }
      responses:
        '201': { description: Created field tag, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionFieldTagResponse' } } } }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '422': { description: Invalid category, validation errors, or unsupported model }
  /form_definitions/{model}/field_tags/{id}:
    parameters:
      - { in: path, name: model, required: true, schema: { type: string, enum: [properties, contacts, companies, notes] } }
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      summary: Update a field tag
      description: >-
        Requires `form_definitions.edit`. Accepts either `{ field_tag: tag }` or the tag object directly.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormDefinitionFieldTagInput' }
      responses:
        '200': { description: Updated field tag, content: { application/json: { schema: { $ref: '#/components/schemas/FormDefinitionFieldTagResponse' } } } }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '404': { description: Field tag not found in this shop and model }
        '422': { description: Invalid category, validation errors, or unsupported model }
    delete:
      summary: Delete a field tag
      description: Requires `form_definitions.edit`. A tag referenced by `field_overrides.tag_ids` cannot be deleted.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '204': { description: Field tag deleted }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing form_definitions.edit scope }
        '404': { description: Field tag not found in this shop and model }
        '409': { description: Tag is referenced by field_overrides.tag_ids }
        '422': { description: Unsupported model }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    AutomationDraftId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    AutomationDraftIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact current draft revision ETag, for example `"revision-1"`.
      schema: { type: string, pattern: '^"revision-[1-9][0-9]*"$' }
    AutomationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable request identity. Reuse only with the identical operation and body.
      schema: { type: string, minLength: 1, maxLength: 255 }
  examples:
    AutomationDirectPlan:
      summary: Direct plan with terminal if_else
      value:
        schema_version: '2026-08-26'
        external_key: example.direct.follow_up
        name: Beispiel-Nachbereitung
        trigger: { type: record_event, entity: contact, event: created }
        steps:
          - type: if_else
            conditions: [{ field: contact.email, operator: present }]
            then: [{ type: create_note, body: E-Mail-Adresse vorhanden, creator: { email: agent-owner@example.test } }]
            else: [{ type: create_task, title: E-Mail-Adresse ergänzen, creator: { email: agent-owner@example.test } }]
    AutomationRecipePlan:
      summary: Recipe plan
      value:
        schema_version: '2026-08-26'
        external_key: example.recipe.inquiry
        name: Beispiel-Rezept
        recipe:
          key: portal_inquiry_standard
          version: 1
          parameters: { creator: { email: agent-owner@example.test } }
    AutomationWebhookPlan:
      summary: Webhook plan
      value:
        schema_version: '2026-08-26'
        external_key: example.webhook.note
        name: Beispiel-Webhook
        trigger: { type: webhook, method: post }
        steps: [{ type: create_note, body: Webhook eingegangen, creator: { email: agent-owner@example.test } }]
    AutomationSchedulePlan:
      summary: Schedule plan
      value:
        schema_version: '2026-08-26'
        external_key: example.schedule.task
        name: Beispiel-Zeitplan
        trigger: { type: schedule, mode: days, every: 1, time_of_day: '09:00', timezone: Europe/Berlin }
        steps: [{ type: create_task, title: Tägliche Prüfung, creator: { email: agent-owner@example.test } }]
  schemas:
    NavigationLink:
      type: object
      required: [id, name, url, internal, visibility, team_ids, hidden, position, updated_at]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 25 }
        url: { type: string, description: An https URL or a path of this propgen instance starting with "/". }
        internal: { type: boolean, description: True for paths of this propgen instance (open in the same tab). }
        visibility: { type: string, enum: [all, teams] }
        team_ids: { type: array, items: { type: integer } }
        hidden: { type: boolean }
        position: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    NavigationLinkInput:
      type: object
      properties:
        name: { type: string, maxLength: 25 }
        url: { type: string }
        visibility: { type: string, enum: [all, teams] }
        team_ids: { type: array, items: { type: integer }, description: Teams of the API key's shop; required for visibility teams. }
        hidden: { type: boolean }
    NavigationLinkResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/NavigationLink' }
    TextSnippetCategory:
      type: object
      required: [id, name, color]
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: string }
    TextSnippet:
      type: object
      required: [id, name, model, email_tag_ids, pinned, position, show_legal_form, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { type: string, nullable: true }
        description: { type: string, nullable: true }
        body_html: { type: string, description: Present on create/update/detail responses and omitted from list items. }
        body_text: { type: string, nullable: true, description: Present on create/update/detail responses and omitted from list items. }
        model: { type: string, enum: [email, task, note, appointment] }
        category:
          allOf: [{ $ref: '#/components/schemas/TextSnippetCategory' }]
          nullable: true
        email_tag_ids: { type: array, items: { type: integer } }
        pinned: { type: boolean }
        position: { type: integer, minimum: 0 }
        show_legal_form: { type: boolean }
        updated_at: { type: string, format: date-time }
    TextSnippetInput:
      type: object
      properties:
        name: { type: string }
        subject: { type: string, nullable: true }
        description: { type: string, nullable: true }
        body_html: { type: string }
        body_text: { type: string, nullable: true }
        model: { type: string, enum: [email, task, note, appointment] }
        category_id: { type: integer, nullable: true, description: Must identify a text-snippet category in the API key's shop. }
        email_tag_ids: { type: array, items: { type: integer }, description: Replaces the complete email-tag assignment when submitted. }
        pinned: { type: boolean }
        position: { type: integer, minimum: 0 }
        show_legal_form: { type: boolean }
    TextSnippetResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/TextSnippet' }
    TextSnippetReference:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    TextSnippetUsageConflict:
      type: object
      required: [error, references]
      properties:
        error: { type: string, enum: [resource_in_use] }
        references:
          type: object
          required: [automations, booking_pages]
          properties:
            automations: { type: array, items: { $ref: '#/components/schemas/TextSnippetReference' } }
            booking_pages: { type: array, items: { $ref: '#/components/schemas/TextSnippetReference' } }
    LandingpageTemplate:
      type: object
      required: [id, name, template_kind, system, default_for_properties, default_for_projects, body_bytesize, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        body:
          type: string
          x-maxBytes: 524288
          description: Executable HTML/Liquid, present on create, update, and detail responses and omitted from list items.
        template_kind: { type: string, enum: [property, project, universal] }
        system: { type: boolean, description: System templates cannot be renamed, have their body or kind changed, or be deleted. }
        default_for_properties: { type: boolean }
        default_for_projects: { type: boolean }
        body_bytesize: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LandingpageTemplateInput:
      type: object
      properties:
        name: { type: string }
        body:
          type: string
          x-maxBytes: 524288
          description: Complete executable HTML/Liquid template validated against the public landingpage merge surface.
        template_kind: { type: string, enum: [property, project, universal] }
        default_for_properties: { type: boolean }
        default_for_projects: { type: boolean }
    LandingpageTemplateResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/LandingpageTemplate' }
    LandingpageTemplatePropertyReference:
      type: object
      required: [id, name, deleted]
      properties:
        id: { type: integer }
        name: { type: string }
        deleted: { type: boolean }
    LandingpageTemplateUsageConflict:
      type: object
      required: [error, references]
      properties:
        error: { type: string, enum: [resource_in_use] }
        references:
          type: object
          required: [properties, published_links]
          properties:
            properties:
              type: object
              required: [total, data]
              properties:
                total: { type: integer }
                data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/LandingpageTemplatePropertyReference' } }
            published_links:
              type: object
              required: [total]
              properties:
                total: { type: integer }
    LetterTemplate:
      type: object
      required: [id, name, category, filename, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string, nullable: true, enum: [property_expose, letter, contract, report, other] }
        model: { type: string, nullable: true, enum: [property, contact, company] }
        filename: { type: string }
        updated_at: { type: string, format: date-time }
    LetterTemplateResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/LetterTemplate' }
    InvalidMergeTemplateResponse:
      type: object
      additionalProperties: false
      required: [error, findings]
      properties:
        error: { type: string, enum: [invalid_merge_template] }
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, severity, expression, explanation, location]
            properties:
              code: { type: string, example: invalid_docx_function }
              severity: { type: string, enum: [error] }
              expression: { type: string, example: '{{ process.exit() }}' }
              explanation: { type: string }
              location:
                type: object
                additionalProperties: false
                required: [part, paragraph, offset, length, line, column]
                properties:
                  part: { type: string, example: word/document.xml }
                  paragraph: { type: integer, minimum: 1 }
                  offset: { type: integer, minimum: 0 }
                  length: { type: integer, minimum: 1 }
                  line: { type: integer, minimum: 1 }
                  column: { type: integer, minimum: 1 }
    TemplateCapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [schema_version, data]
      properties:
        schema_version: { type: string, enum: [template-capabilities.v1] }
        data:
          type: object
          additionalProperties: false
          required: [text_snippets, landingpage_templates, letter_templates]
          properties:
            text_snippets:
              type: object
              additionalProperties: false
              required: [model]
              properties:
                model: { type: array, items: { type: string, enum: [email, task, note, appointment] } }
            landingpage_templates:
              type: object
              additionalProperties: false
              required: [template_kind]
              properties:
                template_kind: { type: array, items: { type: string, enum: [property, project, universal] } }
            letter_templates:
              type: object
              additionalProperties: false
              required: [model, category]
              properties:
                model: { type: array, items: { type: string, enum: [property, contact, company] } }
                category: { type: array, items: { type: string, enum: [property_expose, letter, contract, report, other] } }
    MergeSurface:
      type: object
      additionalProperties: false
      required: [key, dialect, visibility]
      properties:
        key: { type: string, enum: [email, text_snippet, landingpage, internal_docx] }
        dialect: { type: string, enum: [liquid, docx_templates] }
        visibility: { type: string, enum: [internal_output, public_output] }
    MergeSurfacesResponse:
      type: object
      additionalProperties: false
      required: [schema_version, registry_revision, surfaces]
      properties:
        schema_version: { type: string, enum: [merge-contract.v3] }
        registry_revision: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        surfaces: { type: array, items: { $ref: '#/components/schemas/MergeSurface' } }
    MergeScope:
      type: object
      additionalProperties: false
      required: [key, label, model]
      properties:
        key:
          type: string
          enum: [global, kontakt, unternehmen, einheit, mietvertrag, termin, aufgabe, notiz, deal, projekt, booking, user, unterzeichner, absender, aktueller_nutzer, konto, firma, datenraum, ausloeser_kontakt, ausloeser_unternehmen, ausloeser_einheit]
        label: { type: string }
        model: { type: string, nullable: true }
        alias_of:
          type: string
          nullable: true
          example: konto
          description: >-
            Scope whose fields this scope shares. `firma` renders the same record as `konto`. The `ausloeser_*`
            scopes share the fields of `kontakt`, `unternehmen` and `einheit` but render the automation trigger's records.
    MergeAvailability:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [available, conditional, unavailable] }
        when: { type: array, items: { type: string } }
    MergeTraversal:
      type: object
      additionalProperties: false
      required: [target_scope, aliases, syntax_pattern, invented_subpaths_allowed]
      properties:
        target_scope: { type: string, enum: [kontakt, unternehmen, user, mixed] }
        aliases: { type: array, items: { type: string } }
        syntax_pattern: { type: string, example: '{{ einheit.<alias>.<registered-target-field> }}' }
        invented_subpaths_allowed: { type: boolean, enum: [false] }
    MergeCollectionItemField:
      type: object
      additionalProperties: false
      required: [path, label, type, rendered_type, format, syntax, public_merge, internal_only]
      properties:
        path: { type: string, example: '$kontakt.first_name' }
        label: { type: string }
        type: { type: string }
        rendered_type: { type: string }
        format: { type: string, nullable: true }
        syntax: { type: string, example: '{{ $kontakt.first_name }}' }
        public_merge: { type: boolean }
        internal_only: { type: boolean }
        structure: { $ref: '#/components/schemas/MergeValueStructure' }
    MergeValueStructureField:
      type: object
      additionalProperties: false
      required: [key, label, type, rendered_type, format]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string }
        rendered_type: { type: string }
        format: { type: string, nullable: true }
        structure: { $ref: '#/components/schemas/MergeValueStructure' }
    MergeValueStructure:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, item]
          properties:
            type: { type: string, enum: [array] }
            item: { $ref: '#/components/schemas/MergeValueObjectStructure' }
        - type: object
          additionalProperties: false
          required: [type, keys, values]
          properties:
            type: { type: string, enum: [object] }
            keys:
              type: object
              additionalProperties: false
              required: [type]
              properties:
                type: { type: string, enum: [string] }
            values: { $ref: '#/components/schemas/MergeValueObjectStructure' }
    MergeValueObjectStructure:
      type: object
      additionalProperties: false
      required: [type, variable, fields]
      properties:
        type: { type: string, enum: [object] }
        variable: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/MergeValueStructureField' } }
    MergeCollectionPairAccess:
      type: object
      additionalProperties: false
      required: [access, variable]
      properties:
        access: { type: string, example: 'poi_category[0]' }
        variable: { type: string, example: category_key }
        type: { type: string, enum: [string, object] }
    MergeCollectionPair:
      type: object
      additionalProperties: false
      required: [variable, key, value]
      properties:
        variable: { type: string, example: poi_category }
        key: { $ref: '#/components/schemas/MergeCollectionPairAccess' }
        value: { $ref: '#/components/schemas/MergeCollectionPairAccess' }
    MergeCollectionContract:
      type: object
      additionalProperties: false
      required: [iteration, item, loop]
      properties:
        iteration: { type: string, enum: [array, key_value] }
        pair: { $ref: '#/components/schemas/MergeCollectionPair' }
        item:
          type: object
          additionalProperties: false
          required: [variable, scope, fields]
          properties:
            variable: { type: string, example: kontakt }
            scope: { type: string, example: kontakt }
            fields: { type: array, items: { $ref: '#/components/schemas/MergeCollectionItemField' } }
        loop:
          type: object
          additionalProperties: false
          required: [open, local, index, index_base, close, condition, contains]
          properties:
            open: { type: string, example: '{{ FOR kontakt IN collection.kontakte }}' }
            local: { type: string, example: '$kontakt' }
            index: { type: string, example: '$idx' }
            index_base: { type: integer, enum: [0] }
            close: { type: string, example: '{{ END-FOR kontakt }}' }
            condition: { type: string }
            contains: { type: string, example: '.includes("value")' }
            iteration: { type: string, enum: [key_value] }
            key: { $ref: '#/components/schemas/MergeCollectionPairAccess' }
            value: { $ref: '#/components/schemas/MergeCollectionPairAccess' }
    MergeVariable:
      type: object
      additionalProperties: false
      required: [path, scope, context_scopes, label, kind, type, rendered_type, format, syntax, aliases, public_merge, internal_only, requirements, availability]
      properties:
        path: { type: string }
        scope:
          type: string
          description: Primary entity scope. For collections, item scope is documented separately under `collection.item.scope`.
        context_scopes:
          type: array
          minItems: 1
          items: { type: string }
          description: Contexts in which the variable can be materialized. The `scope` query matches this list.
        label: { type: string }
        kind: { type: string, enum: [field, association, association_field, collection, runtime_field] }
        type: { type: string }
        rendered_type: { type: string }
        runtime:
          type: object
          additionalProperties: true
          description: Surface-specific representation and usage examples derived from the rendering policy.
          properties:
            source_type: { type: string }
            renders_as: { type: string }
            item_type: { type: string }
            value_semantics: { type: string, enum: [option_label, option_labels, joined_option_labels] }
            unknown_values: { type: string, enum: [preserve_raw] }
            separator: { type: string }
            display_example: { type: string }
            json_example: { type: string }
        format: { type: string, nullable: true }
        syntax: { type: string }
        aliases: { type: array, items: { type: string } }
        public_merge:
          type: boolean
          description: Registry visibility marker. False means internal-only; missing classification defaults to false. Authenticated internal discovery still returns the field.
        internal_only: { type: boolean, description: Exact inverse of public_merge. }
        requirements: { type: array, items: { type: string } }
        availability: { $ref: '#/components/schemas/MergeAvailability' }
        target_scope: { type: string, enum: [kontakt, unternehmen, user, mixed] }
        indexed_count: { type: integer, minimum: 1 }
        traversal: { $ref: '#/components/schemas/MergeTraversal' }
        collection: { $ref: '#/components/schemas/MergeCollectionContract' }
        structure: { $ref: '#/components/schemas/MergeValueStructure' }
    MergeVariablesResponse:
      type: object
      additionalProperties: false
      required: [schema_version, registry_revision, surface, scope, scopes, variables]
      properties:
        schema_version: { type: string, enum: [merge-contract.v3] }
        registry_revision: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        surface: { type: string, enum: [email, text_snippet, landingpage, internal_docx] }
        scope:
          type: string
          nullable: true
          enum: [global, kontakt, unternehmen, einheit, mietvertrag, termin, aufgabe, notiz, deal, projekt, booking, user, unterzeichner, absender, aktueller_nutzer, konto, firma, datenraum, ausloeser_kontakt, ausloeser_unternehmen, ausloeser_einheit]
        scopes: { type: array, items: { $ref: '#/components/schemas/MergeScope' } }
        variables: { type: array, items: { $ref: '#/components/schemas/MergeVariable' } }
    MergeInvalidParameterError:
      type: object
      additionalProperties: false
      required: [error, parameter, value, allowed_values]
      properties:
        error: { type: string, enum: [invalid_surface, invalid_scope] }
        parameter: { type: string, enum: [surface, scope] }
        value: { type: string, nullable: true }
        allowed_values:
          type: array
          items: { type: string }
    MergeDocxCommand:
      type: object
      additionalProperties: false
      required: [name, supported, expression, examples]
      properties:
        name: { type: string, enum: [QUERY, INS, IF, ELSE, END-IF, FOR, END-FOR, IMAGE, LINK, HTML] }
        supported: { type: boolean }
        expression: { type: string }
        reason: { type: string }
        end_tag: { type: string }
        else_command: { type: string }
        parent: { type: string }
        closes: { type: string }
        placement: { type: string }
        requirements: { type: array, items: { type: string } }
        examples: { type: array, items: { type: string } }
    MergeDocxOperator:
      type: object
      additionalProperties: false
      required: [token, arity]
      properties:
        token: { type: string }
        arity: { type: integer, minimum: 1, maximum: 2 }
        receiver_types: { type: array, items: { type: string } }
        argument_type: { type: string }
    MergeUnsupportedDocxSyntax:
      type: object
      additionalProperties: false
      required: [syntax, reason]
      properties:
        syntax: { type: string }
        reason: { type: string }
    MergeDocxExpressions:
      type: object
      additionalProperties: false
      required: [types, operators, examples, unsupported]
      properties:
        types: { type: array, items: { type: string } }
        operators: { type: array, items: { $ref: '#/components/schemas/MergeDocxOperator' } }
        examples: { type: array, items: { type: string } }
        unsupported: { type: array, items: { $ref: '#/components/schemas/MergeUnsupportedDocxSyntax' } }
    MergeDocxLoops:
      type: object
      additionalProperties: false
      required: [source, open, local, local_must_match_collection, index, index_base, close, close_requires_matching_local, nested, examples]
      properties:
        source: { type: string, enum: [registered_collection_or_registered_alias] }
        open: { type: string }
        local: { type: string }
        local_must_match_collection: { type: boolean, enum: [true] }
        index: { type: string, enum: ['$idx'] }
        index_base: { type: integer, enum: [0] }
        close: { type: string }
        close_requires_matching_local: { type: boolean, enum: [true] }
        nested: { type: boolean }
        examples: { type: array, items: { type: string } }
    MergeDocxEndTag:
      type: object
      additionalProperties: false
      required: [tag, syntax]
      properties:
        tag: { type: string, enum: [END-IF, END-FOR] }
        syntax: { type: string }
    MergeDocxHelperArgument:
      type: object
      additionalProperties: false
      required: [name, type, required]
      properties:
        name: { type: string }
        type: { type: string }
        required: { type: boolean }
        default: { oneOf: [{ type: number }, { type: string }, { type: boolean }] }
    MergeDocxHelper:
      type: object
      additionalProperties: false
      required: [name, canonical_name, commands, arguments, requirements, examples]
      properties:
        name: { type: string }
        canonical_name: { type: string }
        alias_of: { type: string }
        commands: { type: array, items: { type: string, enum: [IMAGE, LINK, INS] } }
        arguments: { type: array, items: { $ref: '#/components/schemas/MergeDocxHelperArgument' } }
        requirements:
          type: array
          items: { type: string, enum: [word_image_placeholder] }
        examples: { type: array, items: { type: string } }
    MergeCapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [schema_version, registry_revision, surface, dialect, delimiters, implicit_ins, commands, expressions, loops, end_tags, helpers, filters, runtime_behavior]
      properties:
        schema_version: { type: string, enum: [merge-contract.v3] }
        registry_revision: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        surface: { type: string, enum: [email, text_snippet, landingpage, internal_docx] }
        dialect: { type: string, enum: [liquid, docx_templates] }
        delimiters:
          type: object
          additionalProperties: { type: string }
        implicit_ins: { type: string, nullable: true, enum: [canonical] }
        commands:
          type: array
          items:
            type: object
            required: [name, supported, expression, examples]
            additionalProperties: true
        expressions: { type: object, additionalProperties: true }
        loops: { type: object, additionalProperties: true }
        end_tags:
          type: object
          additionalProperties: { type: object }
        helpers: { type: array, items: { type: object, additionalProperties: true } }
        filters: { type: array, items: { type: object, additionalProperties: true } }
        runtime_behavior: { type: object, additionalProperties: true }
    AutomationDeploymentRequest:
      type: object
      additionalProperties: false
      required: [automation_draft_id]
      properties:
        automation_draft_id: { type: integer, minimum: 1, example: 42 }
    AutomationRollbackRequest:
      type: object
      additionalProperties: false
      required: [automation_draft_id, revision]
      properties:
        automation_draft_id: { type: integer, minimum: 1, example: 42 }
        revision: { type: integer, minimum: 1, description: Historical revision whose plan becomes a new linear revision. }
    AutomationDeployment:
      type: object
      additionalProperties: false
      required: [id, automation_draft_id, revision, operation, status, created_at]
      properties:
        id: { type: integer }
        automation_draft_id: { type: integer }
        revision: { type: integer }
        operation: { type: string, enum: [activate, deactivate, rollback] }
        status: { type: string, enum: [pending_approval, active, failed, rejected, cancelled, superseded, rolled_back] }
        failure_code: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time, nullable: true }
        deployed_at: { type: string, format: date-time, nullable: true }
        superseded_at: { type: string, format: date-time, nullable: true }
        rollback_of_id: { type: integer, nullable: true }
    AutomationDeploymentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AutomationDeployment' }
    AutomationDeploymentListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AutomationDeployment' } }
    AutomationCapabilityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          required: [schema_version, limits, triggers, condition_fields, steps, reference_types, recipes, safety, plan_json_schema]
          properties:
            schema_version: { type: string }
            limits:
              type: object
              additionalProperties: false
              required: [max_conditions, max_steps, max_plan_bytes]
              properties:
                max_conditions: { type: integer, description: Maximum number of entries in each condition list. }
                max_steps: { type: integer, description: Maximum total number of nested steps in a plan. }
                max_plan_bytes: { type: integer, description: Maximum UTF-8 byte size of the serialized plan JSON. }
            triggers: { type: array, items: { type: object } }
            condition_fields:
              type: object
              description: Authoritative shop-specific map of supported condition field identifiers and their operators and value types.
              additionalProperties: { type: object }
            condition_operators: { type: array, items: { type: string } }
            flow: { type: object }
            steps: { type: array, items: { type: object } }
            reference_types: { type: array, items: { type: string } }
            reference_selectors: { type: array, items: { type: string } }
            reference_selectors_by_type: { type: object, additionalProperties: { type: array, items: { type: string } } }
            recipes: { type: array, items: { type: object } }
            safety: { type: object }
            plan_json_schema: { type: object, description: JSON Schema Draft 2020-12; validate locally with any standards-compliant validator. }
    AutomationReferenceType:
      type: object
      additionalProperties: false
      required: [type, selectors, scope, lookup_path, sensitive, match_states]
      properties:
        type: { type: string }
        selectors: { type: array, minItems: 1, items: { type: string, enum: [key, name, email] } }
        scope: { type: string, enum: [automation_plans.read] }
        lookup_path: { type: string }
        sensitive: { type: boolean }
        requires: { type: array, items: { type: string, enum: [pipeline] } }
        description: { type: string }
        match_states: { type: array, items: { type: string, enum: [not_found, unique, ambiguous] } }
    AutomationReferenceTypeResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AutomationReferenceType' } }
    AutomationReferenceValue:
      type: object
      additionalProperties: false
      required: [type, label, selector, usable]
      properties:
        type: { type: string }
        label: { type: string }
        selector: { $ref: '#/components/schemas/AutomationReference' }
        usable: { type: boolean, enum: [true] }
    AutomationReferenceDiscoveryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AutomationReferenceValue' } }
        meta:
          type: object
          additionalProperties: false
          required: [limit, has_more, next_cursor, match_state]
          properties:
            limit: { type: integer }
            has_more: { type: boolean }
            next_cursor: { type: string, nullable: true }
            match_state: { type: string, nullable: true, enum: [not_found, unique, ambiguous] }
            selector: { type: string, enum: [key, name, email, query] }
    AutomationReference:
      type: object
      description: Exactly one semantic selector is allowed. Resolution is restricted to the API key's shop; zero and multiple matches fail closed. Database IDs are never accepted here.
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
      properties:
        key: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    AutomationRootEntity:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [email, contact, company, property, deal, task, note, calendar_event]
        id: { type: integer, minimum: 1 }
    AutomationCondition:
      type: object
      additionalProperties: false
      required: [field, operator]
      properties:
        field:
          type: string
          example: deal.value
          description: A supported condition field identifier. Available fields are shop-specific and evolve additively; this example is not exhaustive. Fetch `GET /automation_capabilities` with `automation_plans.read`, use `data.condition_fields` for discovery, and validate the complete plan against `data.plan_json_schema`.
        operator:
          type: string
          enum: [equals, not_equals, present, blank, one_of, none_of, includes, gt, gte, lt, lte]
          description: '`includes` is available for collection fields that list it, such as `note.tags`, and takes a name reference as `value`. Discover background fields in `data.condition_fields` and interactive fields in `data.interactive.condition_fields`. `gt` (greater than), `gte` (at least), `lt` (less than) and `lte` (at most) require a numeric value and are only available for fields with value type `number` (prices, areas, terms); a missing or non-numeric field value never matches. The operators per field are listed in `data.condition_fields`.'
        value:
          description: Required except for `present` and `blank`. Reference fields accept an AutomationReference.
        pipeline:
          allOf: [{ $ref: '#/components/schemas/AutomationReference' }]
          description: Optional semantic pipeline scope when resolving a pipeline-stage value. Rejected for other fields and value-free operators.
    AutomationDuration:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value: { type: integer, minimum: 1 }
        unit: { type: string, enum: [minutes, hours, days] }
    AutomationEventMetadataFilters:
      type: object
      maxProperties: 10
      description: Optional exact-match filters for event metadata. Values are normalized to strings before matching.
      additionalProperties:
        oneOf:
          - { type: string, minLength: 1 }
          - { type: number }
          - { type: boolean }
    AutomationReferenceList:
      type: array
      minItems: 1
      items: { $ref: '#/components/schemas/AutomationReference' }
    AutomationTrigger:
      oneOf:
        - type: object
          required: [type, event]
          description: Interactive mode only. Discover exact events and event-specific filters from `data.interactive` and `data.plan_json_schema`. References use names or user emails, never database IDs. Unsupported filters for an event are rejected.
          properties:
            type: { type: string, enum: [interactive_event] }
            event: { type: string, example: calendar_event.created }
            actors: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
            changed_fields: { type: array, items: { type: string }, description: Only for updated events; schema field names. }
            event_categories: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
            task_categories: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
            assignees: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
            task_tags: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
            note_labels: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
            note_tags: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
            email_tags: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
            pipeline: { $ref: '#/components/schemas/AutomationReference' }
            from_stage: { $ref: '#/components/schemas/AutomationReference' }
            to_stage: { $ref: '#/components/schemas/AutomationReference' }
        - type: object
          additionalProperties: false
          required: [type, entity, event]
          properties:
            type: { type: string, enum: [record_event] }
            entity: { type: string, enum: [contact, company, property, deal, task, note, calendar_event] }
            event: { type: string, enum: [created, updated] }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [deal_stage_changed] }
            pipeline: { $ref: '#/components/schemas/AutomationReference' }
            from_stage: { $ref: '#/components/schemas/AutomationReference' }
            to_stage: { $ref: '#/components/schemas/AutomationReference' }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [portal_inquiry_received] }
        - type: object
          additionalProperties: false
          required: [type, event]
          properties:
            type: { type: string, enum: [runtime_event] }
            event:
              type: string
              description: Must be one of the current `runtime_event` events returned by `/automation_capabilities`; use its embedded `plan_json_schema` as the exact contract.
            email_tags:
              allOf: [{ $ref: '#/components/schemas/AutomationReferenceList' }]
              description: Supported only for `email.sent`.
            event_categories:
              allOf: [{ $ref: '#/components/schemas/AutomationReferenceList' }]
              description: Supported for calendar creation, viewing-completed, and approaching events.
            reminder_offsets:
              type: array
              minItems: 1
              description: Supported only for `calendar_event.approaching`.
              items: { $ref: '#/components/schemas/AutomationDuration' }
            reminder_catch_up:
              type: boolean
              default: true
              description: >-
                Supported only for `calendar_event.approaching`. When `false`, reminders for appointments created or
                rescheduled after their reminder time are not caught up; such runs are logged as skipped with
                `reminder_catch_up_disabled`. Plans replace the whole configuration, so an omitted value means `true`.
            datenraum_templates:
              allOf: [{ $ref: '#/components/schemas/AutomationReferenceList' }]
              description: Supported only for `datenraum.*`; restricts execution to rooms created from the selected shop-owned templates.
            from_phase:
              allOf: [{ $ref: '#/components/schemas/AutomationReference' }]
              description: Supported only for `property.dashboard_phase_changed`; filters before a run is created.
            to_phase:
              allOf: [{ $ref: '#/components/schemas/AutomationReference' }]
              description: Supported only for `property.dashboard_phase_changed`; filters before a run is created.
        - type: object
          additionalProperties: false
          required: [type, entity, availability]
          properties:
            type: { type: string, enum: [manual] }
            entity: { type: string, enum: [contact, company, property, deal] }
            availability: { type: string, enum: [single] }
            surfaces:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [entity_header, command_palette] }
        - type: object
          additionalProperties: false
          required: [type, availability]
          properties:
            type: { type: string, enum: [manual] }
            availability: { type: string, enum: [global] }
            surfaces:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, enum: [entity_header, command_palette] }
        - type: object
          required: [type, mode, timezone]
          properties:
            type: { type: string, enum: [schedule] }
            mode: { type: string, enum: [days, hours, minutes, cron] }
            every: { type: integer, minimum: 1 }
            time_of_day: { type: string, example: '09:30' }
            cron: { type: string, example: '0 9 * * 1-5' }
            timezone: { type: string, example: Europe/Berlin }
        - type: object
          required: [type, method]
          properties:
            type: { type: string, enum: [webhook] }
            method: { type: string, enum: [get, post] }
        - type: object
          required: [type, event]
          properties:
            type: { type: string, enum: [task_lifecycle] }
            event: { type: string, enum: [created, updated, completed, reopened] }
            task_categories: { $ref: '#/components/schemas/AutomationReferenceList' }
            assignees: { $ref: '#/components/schemas/AutomationReferenceList' }
        - type: object
          required: [type, event]
          properties:
            type: { type: string, enum: [note_event] }
            event: { type: string, enum: [created, updated] }
            note_labels: { $ref: '#/components/schemas/AutomationReferenceList' }
            note_tags:
              allOf: [{ $ref: '#/components/schemas/AutomationReferenceList' }]
              description: Note tags (`note_tag` names). The run starts only when the note has at least one of them.
        - type: object
          required: [type, event]
          properties:
            type: { type: string, enum: [booking] }
            event: { type: string, enum: [created, cancelled, no_show] }
            booking_pages: { $ref: '#/components/schemas/AutomationReferenceList' }
    AutomationSendWindow:
      type: object
      additionalProperties: false
      required: [timezone, windows]
      properties:
        timezone: { type: string, example: Europe/Berlin }
        windows:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [days, start, end]
            properties:
              days:
                type: array
                minItems: 1
                uniqueItems: true
                items: { type: integer, minimum: 1, maximum: 7 }
              start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    AutomationStep:
      description: Structured step. At most 25 steps are allowed across all nested branches. `if_else` and `wait_for_event` must be terminal in their containing sequence and both branches must be non-empty.
      oneOf:
        - $ref: '#/components/schemas/AutomationInteractiveForm'
        - type: object
          additionalProperties: false
          required: [type, duration]
          properties:
            type: { type: string, enum: [delay] }
            duration: { $ref: '#/components/schemas/AutomationDuration' }
        - type: object
          description: Available with `deal_stage_changed`, `email.sent`, and `calendar_event.viewing_completed`. Rechecks the concrete deal from its latest relevant first-party activity or later agreed follow-up time before continuing. When the stage-change trigger selects `to_stage`, continuation is also guarded by the deal still being in that stage after the wait.
          additionalProperties: false
          required: [type, duration]
          properties:
            type: { type: string, enum: [wait_for_deal_follow_up] }
            duration: { $ref: '#/components/schemas/AutomationDuration' }
        - type: object
          additionalProperties: false
          required: [type, field, recheck]
          properties:
            type: { type: string, enum: [wait_until] }
            field: { type: string, enum: [deal.reservation_expires_at] }
            recheck: { $ref: '#/components/schemas/AutomationDuration' }
            missing_value: { type: string, enum: [skip], default: skip }
        - type: object
          description: Pauses the durable run until the correlated event occurs or the timeout expires. The event must be discovered from `steps[type=wait_for_event].events` in `/automation_capabilities`. Dry-runs never persist a wait state and preview `on_event`.
          additionalProperties: false
          required: [type, event, timeout, on_event, on_timeout]
          properties:
            type: { type: string, enum: [wait_for_event] }
            event:
              type: string
              description: A current `runtime_event` event advertised by `/automation_capabilities`.
            timeout: { $ref: '#/components/schemas/AutomationDuration' }
            filters: { $ref: '#/components/schemas/AutomationEventMetadataFilters' }
            on_event:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/AutomationStep' }
            on_timeout:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/AutomationStep' }
        - type: object
          description: Continues only on the true branch; a false result terminates that path.
          additionalProperties: false
          required: [type, conditions]
          properties:
            type: { type: string, enum: [filter] }
            conditions:
              type: array
              minItems: 1
              maxItems: 10
              items: { $ref: '#/components/schemas/AutomationCondition' }
        - type: object
          description: Controlled terminal branch. It must be the final step in its containing sequence; both branches are required and non-empty.
          additionalProperties: false
          required: [type, conditions, then, else]
          properties:
            type: { type: string, enum: [if_else] }
            conditions:
              type: array
              minItems: 1
              maxItems: 10
              items: { $ref: '#/components/schemas/AutomationCondition' }
            then:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/AutomationStep' }
            else:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/AutomationStep' }
        - type: object
          description: >-
            Repeats `body` for the trigger's records. Without `source`, `body` runs once per entry of `collection`
            (at most `max_items` entries); `email_draft` with `recipient: contact` addresses the entry when it is a
            contact, otherwise the trigger contact. With a `property_contacts` source, the loop groups the related contacts of the trigger's
            properties instead: every active contact association of the given `association_type` (and, when set,
            `custom_label`, compared case-insensitively) at an offered property – with `self_and_ancestors` also at
            its parent properties – yields exactly one pass per contact, carrying the offered properties it covers
            (each listed once). `max_items` then limits contacts, not properties. In such a pass `recipient: contact`
            is that contact; emails and tasks link that contact and its properties by default (leave
            `include_trigger_property` unset). Email merge fields `kontakt.*`/`anrede` address that contact,
            `collection.immobilien` lists its properties, and `ausloeser_kontakt.*`, `ausloeser_unternehmen.*` and
            `ausloeser_einheit.*` keep the trigger's records. Retrying the same run with unchanged step parameters skips
            actions already recorded as successful for that contact, independent of group order; other actions
            still execute, and changed parameters count as a new action. `body` must not contain `delay`, `wait_until`, `wait_for_event`, step approvals or
            portal actions; with a source it also must not contain another `for_each` or an `email_draft` with
            `send_window`. Discover the current limits in `steps[type=for_each]` of `/automation_capabilities`.
          additionalProperties: false
          required: [type, collection, max_items, body]
          properties:
            type: { type: string, enum: [for_each] }
            collection:
              type: string
              enum: [collections.emails, collections.contacts, collections.companies, collections.properties, collections.deals, collections.tasks, collections.calendar_events]
              description: Trigger collection to iterate. Must be `collections.properties` when `source` is set.
            max_items: { type: integer, minimum: 1, maximum: 50 }
            source:
              type: object
              additionalProperties: false
              required: [kind, association_type, hierarchy]
              properties:
                kind: { type: string, enum: [property_contacts] }
                association_type: { type: string, enum: [owner, associated, buyer, renter, service_provider] }
                custom_label:
                  type: string
                  description: Optional role at the property, e.g. `coworking` or `hausmeister` for `service_provider`. Omit to match every association of the type.
                hierarchy: { type: string, enum: [self, self_and_ancestors] }
            body:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/AutomationStep' }
        - type: object
          additionalProperties: false
          required: [type, title, creator]
          properties:
            type: { type: string, enum: [create_task] }
            title: { type: string, maxLength: 500 }
            body: { type: string, maxLength: 10000 }
            creator: { $ref: '#/components/schemas/AutomationReference' }
            category: { $ref: '#/components/schemas/AutomationReference' }
            assignee_mode:
              type: string
              enum: [manual, actor, property_user, contact_user, deal_assignees]
              description: Combines the dynamic role with explicit assignees/teams. An empty role keeps explicit assignments or falls back to creator, with an assignee_role_empty step warning.
            assignees:
              type: array
              items: { $ref: '#/components/schemas/AutomationReference' }
              description: User references by email. Empty means no explicit users.
            teams:
              type: array
              items: { $ref: '#/components/schemas/AutomationReference' }
              description: Team references by exact name, compiled to assignee_team_ids. Empty means no assigned teams.
            priority: { type: string, enum: [low, normal, high] }
            due_in:
              type: object
              additionalProperties: false
              required: [value, unit]
              properties:
                value: { type: integer, minimum: 0 }
                unit: { type: string, enum: [minutes, hours, days, weeks] }
                time_of_day: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        - type: object
          additionalProperties: false
          required: [type, body, creator]
          properties:
            type: { type: string, enum: [create_note] }
            body: { type: string, maxLength: 10000 }
            creator: { $ref: '#/components/schemas/AutomationReference' }
            projects:
              type: array
              items: { $ref: '#/components/schemas/AutomationReference' }
              description: Fixed projects (reference type `project`, selector `name` is the project title) linked to every note.
            projects_from_trigger:
              type: boolean
              description: "Also links the projects of the trigger context: for Datenraum triggers the projects of the Datenraum, otherwise the projects of the trigger contact. Several matches link all of them; no match creates the note without a project. Added to `projects`."
            project_parent:
              allOf: [{ $ref: '#/components/schemas/AutomationReference' }]
              description: Only with `projects_from_trigger`. Keeps only trigger projects that are subprojects (any depth) of this project.
        - type: object
          additionalProperties: false
          required: [type, mail_account, subject]
          properties:
            type: { type: string, enum: [email_draft] }
            mail_account: { $ref: '#/components/schemas/AutomationReference' }
            recipient:
              type: string
              enum: [contact, property_user]
              default: contact
              description: "`contact` is the trigger contact. Inside a `for_each` over `collections.contacts` it is the current contact; inside a `property_contacts` loop it is the pass's grouped contact. `property_user` is the responsible user (Hauptnutzer) of the trigger property and requires a trigger with property context; `kontakt.*` and `einheit.*` still mean the trigger contact and property."
            fallback_user:
              allOf: [{ $ref: '#/components/schemas/AutomationReference' }]
              description: Only with `recipient` `property_user`. Receives the email when the property has no responsible user. Mutually exclusive with `fallback_team`.
            fallback_team:
              allOf: [{ $ref: '#/components/schemas/AutomationReference' }]
              description: Only with `recipient` `property_user`. Its active members receive the email when the property has no responsible user. Mutually exclusive with `fallback_user`.
            subject: { type: string, maxLength: 500 }
            body_text: { type: string, maxLength: 50000 }
            body_html: { type: string, maxLength: 100000 }
            delivery_mode: { type: string, enum: [draft_only, send], default: draft_only }
            snippet: { $ref: '#/components/schemas/AutomationReference' }
            tags: { $ref: '#/components/schemas/AutomationReferenceList' }
            include_trigger_property: { type: boolean, default: false }
            send_window: { $ref: '#/components/schemas/AutomationSendWindow' }
        - type: object
          additionalProperties: false
          required: [type, pipeline, stage, creator]
          properties:
            type: { type: string, enum: [move_deal_stage] }
            pipeline: { $ref: '#/components/schemas/AutomationReference' }
            stage: { $ref: '#/components/schemas/AutomationReference' }
            creator: { $ref: '#/components/schemas/AutomationReference' }
            deal_lookup:
              type: string
              enum: [trigger_deal, context_pair]
              default: trigger_deal
              description: context_pair selects the unique open deal matching a trigger property and contact or company in the required pipeline. No match or multiple matches skip with deal_not_found or deal_ambiguous. trigger_deal uses the resolved trigger context; see automations-e2e.md for inference semantics.
        - type: object
          additionalProperties: false
          required: [type, title, pipeline, stage, creator]
          properties:
            type: { type: string, enum: [create_deal] }
            title: { type: string, maxLength: 500 }
            pipeline: { $ref: '#/components/schemas/AutomationReference' }
            stage: { $ref: '#/components/schemas/AutomationReference' }
            creator: { $ref: '#/components/schemas/AutomationReference' }
        - type: object
          additionalProperties: false
          required: [type, target, fields]
          properties:
            type: { type: string, enum: [apply_entity_updates] }
            target: { type: string, enum: [contact, company, property] }
            fields:
              type: object
              additionalProperties: false
              required: [status_ids]
              properties:
                status_ids: { $ref: '#/components/schemas/AutomationReferenceList' }
            overwrite: { type: boolean, default: false }
        - type: object
          additionalProperties: false
          required: [type, phase]
          properties:
            type: { type: string, enum: [set_property_dashboard_phase] }
            phase: { $ref: '#/components/schemas/AutomationReference' }
        - type: object
          description: Removes only the selected shop tags from the direct or associated target records. Missing tags are an idempotent no-op. Discover valid direct and associated target keys and the target-specific tag reference type from `/automation_capabilities`.
          additionalProperties: false
          required: [type, target, tags]
          properties:
            type: { type: string, enum: [remove_tag] }
            target:
              type: string
              description: A direct target (`contact`, `company`, or `property`) or an association target key advertised for `remove_tag` by `/automation_capabilities`.
              example: property.contact_associations_owners
            tags:
              $ref: '#/components/schemas/AutomationReferenceList'
        - type: object
          description: Adds (`add_newsletter_audience`) or removes (`remove_newsletter_audience`) newsletter audiences on contacts. Adding keeps all other audiences of the contact; removing drops only the named ones, and an absent audience is an idempotent no-op. Audiences are `newsletter_tag` references by name. A changed contact is synchronized to the Brevo lists linked to its audiences when the Brevo contact sync is enabled.
          additionalProperties: false
          required: [type, target, audiences]
          properties:
            type: { type: string, enum: [add_newsletter_audience, remove_newsletter_audience] }
            target:
              type: string
              description: '`contact` or a contact association target key advertised for the step by `/automation_capabilities`, e.g. a company''s employees (at most 50 records per run).'
              example: company.contact_associations_employees
            audiences:
              $ref: '#/components/schemas/AutomationReferenceList'
        - type: object
          required: [type, creator]
          oneOf:
            - required: [deal_lookup, pipeline]
              properties:
                deal_lookup: { type: string, enum: [context_pair] }
            - properties:
                deal_lookup: { type: string, enum: [trigger_deal] }
              not:
                required: [pipeline]
          properties:
            type: { type: string, enum: [update_deal] }
            title: { type: string, maxLength: 500 }
            description: { type: string, maxLength: 10000 }
            value: { type: number }
            probability: { type: number }
            creator: { $ref: '#/components/schemas/AutomationReference' }
            pipeline: { $ref: '#/components/schemas/AutomationReference' }
            deal_lookup:
              type: string
              enum: [trigger_deal, context_pair]
              default: trigger_deal
              description: context_pair requires pipeline and selects the unique open deal matching a trigger property and contact or company. Existing deal associations are preserved. No match or multiple matches skip with deal_not_found or deal_ambiguous. trigger_deal uses the resolved trigger context; see automations-e2e.md for inference semantics.
        - type: object
          required: [type]
          properties:
            type: { type: string, enum: [archive_email] }
            user: { $ref: '#/components/schemas/AutomationReference' }
        - type: object
          description: Only with the `email.sent` trigger. Creates one property offering per property linked to the sent email (a linked unit itself, not its parent property) and per `to` recipient that is a contact, like marking the email as offered by hand (offered at the send time, by the sender, referencing the email). CC/BCC recipients and companies get none, and an offering that already exists for the contact, property and email is not created again. The step result reports `created_count`; nothing to create completes with `notice` `no_linked_properties`, `no_contact_recipients` or `already_offered`.
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [mark_properties_offered] }
        - type: object
          description: Only while the shop's Tippgeber-Tool is active (otherwise capability_missing). Writes a tipster's profile change (phone, email, address) from its change note into the contact, with any trigger. Which change - the trigger note when it is a change note, else the change of the trigger task „Profiländerung freigeben“, else every open change of the trigger contact, oldest first. Nothing open completes with `notice` `no_open_change`; a change applied before is not written again. A new email address replaces the old one for the tipster's sign-in.
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [apply_profile_change] }
    AutomationRecipe:
      type: object
      additionalProperties: false
      required: [key, version, parameters]
      properties:
        key: { type: string, enum: [portal_inquiry_standard, viewing_feedback_standard] }
        version: { type: string, enum: ['1'] }
        parameters:
          type: object
          description: 'Recipe-specific parameters listed by `/automation_recipes/{id}`. Parameters are required unless advertised with required: false; unknown keys are rejected. viewing_feedback_standard additionally accepts event_categories (non-empty event_category references; default Besichtigung), send_delay and feedback_timeout (positive value and unit minutes/hours/days, at most 365 days), and timeout_stage (pipeline_stage reference in the selected pipeline). Explicit send_delay waits from the deal last relevant contact, no earlier than the trigger; omission retains the fixed 2-hour delay. feedback_timeout defaults to 48 hours. timeout_stage adds a stage move after the timeout task; omission keeps task-only behavior. create_missing_deal (boolean, default false) creates a deal in viewing_stage for the trigger contact and property when none exists in the selected pipeline. See automations-e2e.md.'
    AutomationInteractiveForm:
      type: object
      additionalProperties: false
      required: [type]
      description: Interactive-only terminal form action; each type supports only its advertised fields in `data.interactive.steps` and `data.plan_json_schema`. Reference lists accept an empty array to clear defaults; nullable references and dates accept null. This prepares a native form, never saves or sends it.
      properties:
        type: { type: string, enum: [open_email_composer, open_task_form, open_note_form, open_calendar_event_form, open_deal_form] }
        presentation: { type: string, enum: [immediate, offer] }
        assignee_mode: { type: string, enum: [manual, actor, property_user] }
        assignees: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
        recipient_mode: { type: string, enum: [single_contact, all_contacts] }
        snippet: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/AutomationReference' }] }
        title: { type: string }
        body: { type: string }
        category: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/AutomationReference' }] }
        tags: { type: array, items: { $ref: '#/components/schemas/AutomationReference' } }
        priority: { type: string, enum: [low, normal, high] }
        pipeline: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/AutomationReference' }] }
        stage: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/AutomationReference' }] }
        due_at: { type: string, format: date-time, nullable: true }
        start_at: { type: string, format: date-time, nullable: true }
        due_at_relative: { $ref: '#/components/schemas/AutomationInteractiveDate' }
        start_at_relative: { $ref: '#/components/schemas/AutomationInteractiveDate' }
        duration_minutes: { type: integer, minimum: 1 }
    AutomationInteractiveDate:
      type: object
      nullable: true
      additionalProperties: false
      required: [value, unit]
      properties:
        base: { type: string, enum: [now, event_start, event_end, task_due], default: now }
        value: { type: integer, minimum: 0 }
        unit: { type: string, enum: [minutes, hours, days, weeks] }
        time_of_day: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    AutomationPlan:
      type: object
      additionalProperties: false
      required: [schema_version, external_key, name]
      properties:
        schema_version: { type: string, enum: ['2026-08-26'] }
        execution_mode: { type: string, enum: [background, interactive], default: background }
        external_key: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,99}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        trigger: { $ref: '#/components/schemas/AutomationTrigger' }
        conditions:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/AutomationCondition' }
        steps:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: '#/components/schemas/AutomationStep' }
        recipe: { $ref: '#/components/schemas/AutomationRecipe' }
      description: Supply either `recipe` or the direct `trigger`/`conditions`/`steps` fields, never both. Omitted execution_mode retains background behavior. Interactive mode requires interactive_event and supports filter, if_else and terminal native form actions, without recipes or background steps. Unknown fields and operators fail closed. Fetch `/automation_capabilities` and validate against `data.plan_json_schema` for the exact shop-specific contract and `data.limits.max_plan_bytes` for the serialized plan size limit. Raw graph fields, caller-controlled node/edge IDs, extension_config, and database-ID reference selectors are rejected. Draft creation is always inactive; interactive actions never save or send the prepared form.
    FormDefinitionDiscovery:
      type: object
      additionalProperties: false
      required: [data, contract_version]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [model, definition_url, category_key_required]
            properties:
              model: { type: string, enum: [properties, contacts, companies, leases, notes] }
              definition_url: { type: string }
              category_key_required: { type: boolean, description: Whether every request for this model requires a category key; currently false because notes also expose a global catalog. }
        contract_version: { type: string, example: '2.0' }
    FormDefinitionUnsupportedModel:
      type: object
      additionalProperties: false
      required: [error, allowed]
      properties:
        error: { type: string, enum: [unsupported_model] }
        allowed:
          type: array
          items: { type: string, enum: [properties, contacts, companies, leases, notes] }
          example: [properties, contacts, companies, leases, notes]
    FormDefinitionEtagMismatch:
      type: object
      additionalProperties: false
      required: [error, current_etag, definition_url]
      properties:
        error: { type: string, enum: [etag_mismatch] }
        current_etag: { type: string, description: Strong ETag to use in the next If-Match header. }
        definition_url: { type: string, description: Relative URL for fetching the current effective definition. }
    FormDefinitionOperationsEnvelope:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/FormDefinitionOperation' }
    FormDefinitionOperation:
      type: object
      description: >-
        Operation-specific fields are strict: upsert_custom_field uses `field` as a custom-field object;
        merge/remove field overrides and field visibility use a string `field`; merge/remove section
        overrides and section visibility use `section`; merge operations also require `changes`;
        upsert_custom_section uses a section object; delete_custom_section uses its name; assign_field
        requires string field and section; unassign_field requires field. set_searchable requires a string field
        naming an existing property custom field and a strict boolean searchable; false disables it.
        Activation requires a supported criterion type. Use operations/validate for a dry run and a fresh
        GET ETag in If-Match for PATCH.
      required: [op]
      properties:
        op:
          type: string
          enum: [set_searchable, upsert_custom_field, merge_field_override, remove_field_override, merge_section_override, remove_section_override, upsert_custom_section, delete_custom_section, assign_field, unassign_field, hide_field, show_field, hide_section, show_section]
        field:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/FormDefinitionCustomFieldInput'
        section:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/FormDefinitionCustomSection'
        changes: { type: object }
        searchable: { type: boolean }
    FormDefinitionCustomFieldCollection:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        category_key: { type: string, description: Present only when a Note category layout was requested. }
        data:
          type: array
          items: { $ref: '#/components/schemas/FormDefinitionCustomField' }
    FormDefinitionFieldTag:
      type: object
      additionalProperties: false
      required: [id, name, color, category_id, category_name, model]
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: string }
        category_id: { type: integer, nullable: true }
        category_name: { type: string, nullable: true }
        model: { type: string, enum: [properties, contacts, companies, notes] }
    FormDefinitionFieldTagAttributes:
      type: object
      properties:
        name: { type: string }
        color: { type: string, example: '#64748B' }
        category_id: { type: integer }
        category_name: { type: string }
    FormDefinitionFieldTagInput:
      oneOf:
        - $ref: '#/components/schemas/FormDefinitionFieldTagAttributes'
        - type: object
          required: [field_tag]
          properties:
            field_tag: { $ref: '#/components/schemas/FormDefinitionFieldTagAttributes' }
    FormDefinitionFieldTagResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/FormDefinitionFieldTag' }
    FormDefinitionFieldTagCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/FormDefinitionFieldTag' }
        meta:
          type: object
          additionalProperties: false
          required: [total]
          properties:
            total: { type: integer }
    FormDefinitionCandidateInput:
      type: object
      description: Canonical write representation. GET also includes the resolved effective_schema, which must not be copied back as write input.
      additionalProperties: false
      required: [custom_fields, customizations]
      properties:
        custom_fields:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/FormDefinitionCustomFieldInput' }
        customizations:
          $ref: '#/components/schemas/FormDefinitionCustomizations'
    FormDefinitionCandidate:
      type: object
      description: Normalized canonical representation returned by validation.
      additionalProperties: false
      required: [custom_fields, customizations]
      properties:
        custom_fields:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/FormDefinitionCustomField' }
        customizations:
          $ref: '#/components/schemas/FormDefinitionCustomizations'
    FormDefinitionOption:
      type: object
      additionalProperties: false
      required: [value, label]
      properties:
        value: { oneOf: [{ type: string }, { type: number }, { type: boolean }] }
        label: { type: string, minLength: 1 }
        disabled: { type: boolean }
        conditions:
          type: array
          maxItems: 20
          description: Conditions controlling this individual option. In a flat array, entries for the same field are ORed and different fields are ANDed; use recursive all_of/any_of groups for explicit grouping.
          items: { $ref: '#/components/schemas/FormDefinitionConditionExpression' }
    FormDefinitionValidation:
      type: object
      description: Field-type-specific validation metadata. Numeric fields validate min and max as finite numbers.
      additionalProperties: true
      properties:
        min: { description: Numeric fields require a finite number; other field types preserve provider-specific metadata. }
        max: { description: Numeric fields require a finite number; other field types preserve provider-specific metadata. }
    FormDefinitionInput:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          description: Shop-local registry used by select or multiselect fields. When set, value_field and label_field are required.
          enum: [cache:property_tags, cache:property_status, cache:contact_tags, cache:contact_status, cache:company_tags, cache:company_status, cache:project_tags, cache:project_status, cache:note_tags, cache:task_tags, cache:event_tags, cache:mail_tags, cache:users, cache:property_users, cache:teams, cache:task_categories, cache:event_categories, cache:pipeline_columns, cache:pipelines, cache:mail_sources, cache:note_labels, cache:speichergruende, cache:rejection_reasons, cache:landingpages, cache:geolages, cache:legal_entities]
        search_endpoint:
          type: string
          enum: [/search/property, /search/company, /search/contact, /search/project]
        target:
          type: string
          enum: [property, unit, company, contact, project, user]
        scope_by:
          type: string
          description: Feldschlüssel einer Relation, welche die Auswahl einschränkt; bei Mieteinheiten muss dies eine Immobilienrelation sein.
        option_list_key:
          type: string
          description: Stable shop-local option-list key for select or multiselect fields. Inline options must then be empty.
        value_field: { type: string, minLength: 1 }
        label_field: { type: string, minLength: 1 }
        placeholder: { type: string }
        suffix: { type: string }
        unit:
          type: string
          maxLength: 24
          description: Canonical display unit for number fields, for example m².
        fixed_decimals: { type: integer, minimum: 0, maximum: 8 }
        icon: { type: string }
        step: { type: number, exclusiveMinimum: 0 }
        currency_code: { type: string }
        currency_symbol: { type: string }
        columns:
          type: array
          minItems: 1
          maxItems: 20
          description: Required row schema for repeater fields; rejected on other field types.
          items: { $ref: '#/components/schemas/FormDefinitionRepeaterColumn' }
    FormDefinitionRepeaterColumn:
      type: object
      additionalProperties: false
      required: [field, label, type]
      properties:
        field: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        label: { type: string, minLength: 1 }
        type: { type: string, enum: [text, number, integer, decimal, currency, select, date] }
        required: { type: boolean }
        options: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/FormDefinitionOption' } }
        placeholder: { type: string }
        suffix: { type: string }
    FormDefinitionCustomFieldInput:
      type: object
      description: New fields are strict. GET can include immutable opaque provider metadata on existing fields; send it back unchanged. Public landing-page availability defaults to true unless read access is restricted.
      required: [field, label, type, required]
      properties:
        field: { type: string, pattern: '^custom_[a-z0-9_]+$' }
        label: { type: string, minLength: 1 }
        type: { type: string, enum: [text, email, tel, textarea, address, boolean, checkbox, number, integer, decimal, percent, currency, date, datetime, select, multiselect, relation, url, repeater] }
        required: { type: boolean }
        searchable:
          type: boolean
          default: false
          description: >-
            Property custom fields only. GET always returns true or false, also in effective_schema;
            an absent stored flag is false. true requires number, integer, decimal, percent, currency,
            date, boolean, checkbox, select or multiselect. Text and repeater fields cannot be enabled.
            This flag does not grant public landing-page access and is independent of public_merge.
        public_merge:
          type: boolean
          default: true
          description: Whether the field is available on public surfaces such as landing pages. Restricted read access always makes the normalized value false.
        options: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/FormDefinitionOption' } }
        validation: { $ref: '#/components/schemas/FormDefinitionValidation' }
        input_props: { $ref: '#/components/schemas/FormDefinitionInput' }
        field_set:
          type: string
          description: Required after normalization for note fields; defaults to the portable `all` field-set key.
    FormDefinitionCustomField:
      allOf:
        - $ref: '#/components/schemas/FormDefinitionCustomFieldInput'
        - type: object
          required: [public_merge]
    FormDefinitionCondition:
      type: object
      additionalProperties: false
      description: Field values are opaque and case-sensitive. Copy canonical values from effective_schema options; the API does not normalize casing.
      required: [field, operator]
      properties:
        field: { type: string }
        operator: { type: string, enum: [eq, ne, in, not_in, present, blank, gt, lt] }
        value: { description: Array for in/not_in, scalar for eq/ne/gt/lt, absent for present/blank. gt/lt are limited to numeric and date fields. }
    FormDefinitionConditionGroup:
      type: object
      additionalProperties: false
      description: A recursive group containing exactly one non-empty all_of or any_of array. Groups can be nested up to five levels; a condition list can contain at most 100 total nodes.
      oneOf:
        - required: [all_of]
          properties:
            all_of:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/FormDefinitionConditionExpression' }
        - required: [any_of]
          properties:
            any_of:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/FormDefinitionConditionExpression' }
    FormDefinitionConditionExpression:
      description: >-
        Canonical writes require a structured condition or recursive group. In a flat conditions array,
        entries for the same field are ORed and entries for different fields are ANDed. The effective read
        schema can still contain legacy strings: `field` means `{field, operator: present}` and `field:value`
        means `{field, operator: eq, value}`. Convert those strings to structured conditions before writing.
      oneOf:
        - $ref: '#/components/schemas/FormDefinitionCondition'
        - $ref: '#/components/schemas/FormDefinitionConditionGroup'
        - type: string
          readOnly: true
          description: Legacy effective-schema read syntax; rejected in canonical write candidates.
    FormDefinitionSectionOverride:
      type: object
      additionalProperties: false
      properties:
        label: { type: string }
        order: { type: number, description: Finite numeric order; fractional values are supported. }
        column: { type: string, enum: [left, right] }
        hidden: { type: boolean }
        collapsible: { type: boolean }
        collapsed: { type: boolean }
        conditions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/FormDefinitionConditionExpression' } }
    FormDefinitionFieldOverride:
      type: object
      additionalProperties: false
      properties:
        label: { type: string }
        placeholder: { type: string }
        help_text: { type: string, description: An explicit empty string clears an inherited base help text; omission preserves it. }
        required: { type: boolean }
        exclude_from_merge: { type: boolean }
        field_layout: { type: string, enum: [label_above, side_by_side, side_by_side_with_labels, address_street] }
        section_width: { type: string, enum: [full, half] }
        default_value: {}
        options: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/FormDefinitionOption' } }
        section: { type: string, description: Known non-special section or __FREE__ }
        order: { type: number, description: Finite numeric order; fractional values are supported. }
        hidden: { type: boolean }
        readonly: { type: boolean }
        conditions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/FormDefinitionConditionExpression' } }
        required_conditions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/FormDefinitionConditionExpression' } }
        computed: { $ref: '#/components/schemas/FormDefinitionComputedField' }
        derived: { $ref: '#/components/schemas/FormDefinitionDerivedField' }
        tag_ids: { type: array, items: { type: integer } }
    FormDefinitionComputedField:
      type: object
      additionalProperties: false
      required: [left, op, right, mode]
      properties:
        left: { type: string, description: Feldschlüssel des linken Operanden. }
        op: { type: string, enum: [add, subtract, multiply, divide, date_diff, date_plus_months] }
        right: { type: string, description: Feldschlüssel des rechten Operanden. }
        mode: { type: string, enum: [readonly, overridable] }
    FormDefinitionDerivedField:
      type: object
      additionalProperties: false
      required: [source_field, source_attr, mode]
      description: Nur materialisierter Prefill; ein Anzeige- oder Live-Modus wird nicht unterstützt.
      properties:
        source_field: { type: string, description: Feldschlüssel einer Relation. }
        source_attr: { type: string, description: Serverseitig freigegebenes Attribut des Relationsziels. }
        mode: { type: string, enum: [prefill] }
    FormDefinitionCustomSection:
      type: object
      additionalProperties: false
      required: [name, label]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        label: { type: string, minLength: 1 }
        order: { type: number, description: Finite numeric order; fractional values are supported. }
        column: { type: string, enum: [left, right] }
        hidden: { type: boolean }
        fields: { type: array, maxItems: 0 }
        conditions: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/FormDefinitionConditionExpression' } }
    FormDefinitionCustomizations:
      type: object
      additionalProperties: false
      properties:
        section_overrides: { type: object, additionalProperties: { $ref: '#/components/schemas/FormDefinitionSectionOverride' } }
        custom_sections: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/FormDefinitionCustomSection' } }
        field_overrides: { type: object, additionalProperties: { $ref: '#/components/schemas/FormDefinitionFieldOverride' } }
        field_assignments: { type: object, additionalProperties: { type: string } }
        hidden_fields: { type: array, items: { type: string } }
        hidden_sections: { type: array, items: { type: string } }
    FormDefinitionValidationResult:
      type: object
      required: [valid, normalized_candidate, errors, warnings, diff]
      properties:
        valid: { type: boolean }
        normalized_candidate: { $ref: '#/components/schemas/FormDefinitionCandidate' }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        warnings: { type: array, items: { type: string } }
        diff:
          type: object
          description: Includes custom-field additions/changes and field-level added, changed, and removed keys for overrides, assignments, custom sections, and hidden elements.
    FormDefinitionValidationFailure:
      type: object
      required: [valid, normalized_candidate, errors, warnings, diff]
      properties:
        valid: { type: boolean, enum: [false] }
        normalized_candidate:
          type: object
          description: Best-effort normalized candidate; invalid values are retained so errors can reference them.
          additionalProperties: true
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        warnings: { type: array, items: { type: string } }
        diff:
          type: object
          description: Best-effort field-level semantic diff; invalid portions may be omitted.
    FormDefinition:
      type: object
      description: >-
        `custom_fields` and `customizations` are the canonical persisted write representation.
        Note requests without `category_key` represent the shop-global field catalog. Requests with a
        stable `category_key` represent an independent category layout referencing those exact global
        field definitions. `effective_schema` is the resolved read representation after base schema,
        defaults, and customizations are applied.
      additionalProperties: false
      required: [model, contract_version, custom_fields, customizations, effective_schema, capabilities]
      properties:
        model: { type: string, enum: [Property, Contact, Company, Lease, Note] }
        contract_version: { type: string, example: '2.0' }
        category_key: { type: string, description: Present only when a Note category layout was requested. }
        custom_fields:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/FormDefinitionCustomField' }
        customizations: { $ref: '#/components/schemas/FormDefinitionCustomizations' }
        effective_schema: { type: object }
        capabilities:
          type: object
          description: >-
            `deletions` is true when custom fields can be removed through the dedicated DELETE endpoint.
            It is false for note category layouts because note fields belong to the global catalog.
    FormDefinitionApplyResponse:
      type: object
      additionalProperties: false
      required: [model, contract_version, custom_fields, customizations, effective_schema, capabilities, warnings, mapping_errors]
      properties:
        model: { type: string, enum: [Property, Contact, Company, Lease, Note] }
        contract_version: { type: string, example: '2.0' }
        category_key: { type: string, description: Present only when a Note category layout was requested. }
        custom_fields:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/FormDefinitionCustomField' }
        customizations: { $ref: '#/components/schemas/FormDefinitionCustomizations' }
        effective_schema: { type: object }
        capabilities:
          type: object
          description: >-
            `deletions` is true when custom fields can be removed through the dedicated DELETE endpoint.
            It is false for note category layouts because note fields belong to the global catalog.
        warnings: { type: array, items: { type: string } }
        mapping_errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, error]
            properties:
              field: { type: string }
              error: { type: string, enum: [mapping_sync_failed] }
    ValidationErrorMessages:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    ValidationErrorDetail:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        row_index: { type: integer, nullable: true }
    ValidationErrorDetails:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/ValidationErrorDetail'
    ValidationFailedResponse:
      type: object
      required: [error, errors, error_details]
      properties:
        error:
          type: string
          enum: [validation_failed]
        errors:
          $ref: '#/components/schemas/ValidationErrorMessages'
        error_details:
          $ref: '#/components/schemas/ValidationErrorDetails'
      example:
        error: validation_failed
        errors:
          phone_numbers:
            - Diese Telefonnummer ist bereits vergeben.
        error_details:
          phone_numbers:
            - code: TAKEN_PHONE_NUMBERS
              message: Diese Telefonnummer ist bereits vergeben.
              row_index: 0
    ContactBatchValidationFailedResponse:
      type: object
      required: [error, index, errors, error_details]
      properties:
        error:
          type: string
          enum: [invalid_item]
        index:
          type: integer
          minimum: 0
          description: Zero-based index of the invalid contact in the submitted array.
        errors:
          oneOf:
            - $ref: '#/components/schemas/ValidationErrorMessages'
            - type: array
              items: { type: string }
        error_details:
          oneOf:
            - $ref: '#/components/schemas/ValidationErrorDetails'
            - type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
      example:
        error: invalid_item
        index: 1
        errors:
          salutation:
            - ist kein gültiger Wert
        error_details:
          salutation:
            - code: INCLUSION_SALUTATION
              message: ist kein gültiger Wert
    PropertyBatchValidationFailedResponse:
      type: object
      required: [error, index, errors, error_details]
      properties:
        error:
          type: string
          enum: [invalid_item]
        index:
          type: integer
          minimum: 0
          description: Zero-based index of the invalid property in the submitted array.
        errors:
          $ref: '#/components/schemas/ValidationErrorMessages'
        error_details:
          $ref: '#/components/schemas/ValidationErrorDetails'
      example:
        error: invalid_item
        index: 1
        errors:
          energieausweis_typ:
            - ist kein gültiger Wert
        error_details:
          energieausweis_typ:
            - code: INCLUSION_ENERGIEAUSWEIS_TYP
              message: ist kein gültiger Wert
    RestrictedEntity:
      type: object
      additionalProperties: false
      required: [id, name, display_name, restricted, caretakers]
      properties:
        id: { type: integer }
        name: { type: string }
        display_name: { type: string }
        title: { type: string }
        objekttitel: { type: string }
        restricted: { type: boolean, enum: [true] }
        caretakers:
          type: array
          description: Empty when no caretaker is assigned. No contact details are included.
          items:
            type: object
            additionalProperties: false
            required: [id, name, teams]
            properties:
              id: { type: integer }
              name: { type: string }
              teams:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  properties:
                    id: { type: integer }
                    name: { type: string }
    ContactSummary:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        full_address: { type: string, nullable: true }
        source_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Contact:
      type: object
      properties:
        invoice_recipient_type: { type: string, enum: [Contact, Company], nullable: true, description: Different invoice recipient (full responses only). }
        invoice_recipient_id: { type: integer, nullable: true }
        tipster_number: { type: string, nullable: true, description: "Tippgeber-ID given by the partner company. Only present while the shop's Tippgeber-Tool is active (full responses only)." }
        tipster_team_number: { type: string, nullable: true, description: "Team-ID given by the partner company. Only present while the shop's Tippgeber-Tool is active (full responses only)." }
        tipster_commission_rate: { type: number, nullable: true, minimum: 0, maximum: 100, description: "Stored personal commission percentage, not the inherited company value. Active Tippgeber-Tool, full responses only." }
        tipster_advance_deduction: { type: boolean, description: "Stored personal advance-deduction agreement. Display only, no calculation. Active Tippgeber-Tool, full responses only." }
        tipster_broker_rate_reduction: { type: number, nullable: true, minimum: 0, maximum: 100, description: "Stored personal broker rate reduction in percentage points; null means none. Active Tippgeber-Tool, full responses only." }
        gwg_warnings:
          type: object
          readOnly: true
          description: >-
            Non-blocking plausibility warnings keyed by contact field (full responses only).
            Saving remains allowed. Each warning has a stable code and a localized message.
            Hidden fields and their dependencies are not disclosed. No completeness or age-of-majority check.
            data.gwg.ausstellungsstaat stores the issuing country's ISO 3166-1 alpha-2 code,
            independently of nationality; select options come from the contact form schema.
            German document numbers (DE) require 9 ASCII letters/digits; other or absent countries use 5–20.
            Dates of birth and issue must precede today; expiry must follow issue, and past expiry warns.
          additionalProperties:
            type: array
            items:
              type: object
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [must_be_in_past, must_follow_issue_date, expired, german_number, basic_number]
                message: { type: string }
        project_ids:
          type: array
          items: { type: integer }
          description: Direct project links in this shop. On writes, omission preserves links and [] clears them.
        id: { type: integer }
        display_name: { type: string }
        full_address: { type: string, nullable: true }
        source_id: { type: integer, nullable: true }
        source_ids:
          type: array
          items: { type: integer }
        crm_source: { type: string, nullable: true }
        crm_import_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
        tag_ids:
          type: array
          items: { type: integer }
        status_ids:
          type: array
          items: { type: integer }
        tags:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              color: { type: string, nullable: true }
        statuses:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              color: { type: string, nullable: true }
              status_category_id: { type: integer, nullable: true }
        associations:
          type: object
          properties:
            project_ids: { type: array, items: { type: integer } }
            properties:
              type: object
              properties:
                owners:
                  type: array
                  items: { type: integer }
                buyers:
                  type: array
                  items: { type: integer }
                renters:
                  type: array
                  items: { type: integer }
                associated:
                  type: array
                  items: { type: integer }
                service_providers:
                  type: array
                  items:
                    type: object
                    properties:
                      property_id: { type: integer }
                      custom_label: { type: string, nullable: true }
                      reciprocal_label: { type: string, nullable: true }
            companies:
              type: object
              properties:
                employers:
                  type: array
                  items: { type: integer }
                clients:
                  type: array
                  items: { type: integer }
                partners:
                  type: array
                  items: { type: integer }
            company_locations:
              type: object
              description: Additive location assignment per company relationship. `companies.*` ID arrays are unchanged.
              properties:
                employers:
                  type: array
                  items: { $ref: '#/components/schemas/CompanyContactAssociation' }
                clients:
                  type: array
                  items: { $ref: '#/components/schemas/CompanyContactAssociation' }
                partners:
                  type: array
                  items: { $ref: '#/components/schemas/CompanyContactAssociation' }
            contacts:
              type: object
              properties:
                relationships:
                  type: array
                  items:
                    type: object
                    properties:
                      related_contact_id: { type: integer }
                      association_type: { type: string }
                      custom_label: { type: string, nullable: true }
                      reciprocal_label: { type: string, nullable: true }
    ContactSearchSummaryRow:
      type: object
      description: Default search hit shape (`fields=summary` or omitted).
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, nullable: true }
    ContactSearchFullRow:
      description: >-
        Full contact row (`fields=full`): same fields as Contact plus normalized top-level `phone_numbers`
        for dial-string verification (`description` is the CRM label / Beschriftung).
      allOf:
        - $ref: '#/components/schemas/Contact'
        - type: object
          properties:
            phone_numbers:
              type: array
              items:
                type: object
                properties:
                  number: { type: string }
                  description: { type: string, nullable: true }
    ContactSearchTelephonyRow:
      type: object
      required: [id, first_name, last_name, display_name, email, matched_phone]
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        email: { type: string }
        matched_phone: { type: string }
      example:
        id: 123
        first_name: Anna
        last_name: Mustermann
        display_name: Anna Mustermann
        email: anna@example.com
        matched_phone: '+4917011122233'
    ContactInput:
      type: object
      additionalProperties: true
      description: >-
        Contact write payload. The API accepts the typed properties below plus top-level
        fields from `/schema/contacts/clean`. Unknown integration fields should use
        `custom_fields` or a `custom_*` top-level key; `custom_foo` is stored as
        `data.custom_fields.foo`. The `data` object is shallow-merged on update.
      properties:
        project_ids:
          type: array
          items: { type: integer }
          description: Direct project links in this shop. On writes, omission preserves links and [] clears them.
        first_name: { type: string, nullable: true }
        middle_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        name_suffix: { type: string, nullable: true, description: Name suffix such as MBA or sen. }
