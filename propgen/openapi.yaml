  /search/contacts:
    get:
      summary: Search contacts
      description: >-
        Requires `contacts.read`.
        Lookup-style search (Elasticsearch-backed) for contacts. Default `fields=summary` returns
        lightweight rows for pickers. Use `fields=full` to return the same contact payload as
        `GET /contacts/:id?fields=full`, plus a top-level `phone_numbers` array (`number` and optional
        `description` label per row) so integrations can verify which contact matches a dialed number
        without parsing the nested `data` blob.

        For 3CX, use `phone=...&fields=telephony` (requires `contacts.read`). This mode returns
        only full normalized phone matches, scoped to active contacts in the API key's shop.
        German national, +49 and 0049 formats are equivalent. International + and 00 prefixes
        are equivalent; foreign national numbers are not interpreted using a guessed country.
        Multiple matching contacts are all returned, without pagination; `limit`, `q` and `query`
        do not affect telephony mode. No match returns `{ "data": [], "meta": { "total": 0 } }`.
        Encode a leading plus as `%2B` in the URL. `matched_phone` is the verified requested
        number with separators removed, allowing 3CX to match the dial string. Existing
        `summary` and `full` responses are unchanged.
      tags: [Search]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search query. `query` is accepted as an alias; one of `q` or `query` is required outside telephony mode.
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Alias for `q`.
        - name: phone
          in: query
          required: false
          schema:
            type: string
          description: Required with `fields=telephony`; not accepted in other modes. Full phone number, not a suffix.
          example: '+4917011122233'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: fields
          in: query
          required: false
          schema:
            type: string
            enum: [summary, full, telephony]
          description: >-
            `summary` (default): id, name, email. `full`: full contact resource per `Contact` schema
            plus top-level `phone_numbers` for disambiguation. `telephony`: flat verified phone matches.
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/ContactSearchSummaryRow'
                        - $ref: '#/components/schemas/ContactSearchFullRow'
                        - $ref: '#/components/schemas/ContactSearchTelephonyRow'
                        - $ref: '#/components/schemas/RestrictedEntity'
                  meta:
                    description: Telephony mode returns only total, counting verified contacts.
                    type: object
                    properties:
                      query: { type: string, nullable: true }
                      total: { type: integer }
                      limit: { type: integer }
                      fields:
                        type: string
                        enum: [summary, full, telephony]
                        description: Echo of the requested `fields` mode (default summary)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Missing query, invalid fields, missing_phone or invalid_phone
        '503':
          description: Telephony search unavailable (search_unavailable); not an empty match result
