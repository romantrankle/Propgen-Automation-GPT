          schema:
            type: string
            description: Comma-separated includes (tags,statuses,associations)
        - name: status_ids
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated status IDs (any match)
            example: "12,34"
        - name: tag_ids
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated tag IDs (any match)
            example: "5,9"
        - name: user_ids
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated primary responsible user IDs (any match)
            example: "149,207"
        - name: einheitennummer
          in: query
          required: false
          description: Exact unit number (case-sensitive, no partial matching). Empty or non-string values return 422 invalid_einheitennummer.
          schema:
            type: string
            minLength: 1
            example: "8878"
        - name: auftragsnummer
          in: query
          required: false
          description: Exact order number (case-sensitive, no partial matching). Empty or non-string values return 422 invalid_auftragsnummer.
          schema:
            type: string
            minLength: 1
            example: "WEB-8878"
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            example: false
        - name: fields
          in: query
          required: false
          schema:
            type: string
            enum: [summary, full]
      responses:
        '200':
          description: Property list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/PropertySummary'
                        - $ref: '#/components/schemas/Property'
                  meta:
                    type: object
                    properties:
                      limit: { type: integer }
                      has_more: { type: boolean }
                      next_cursor: { type: string, nullable: true }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Invalid cursor, updated_since, fields, einheitennummer, or auftragsnummer
