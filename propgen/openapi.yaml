    CompanyBatchItem:
      allOf:
        - $ref: '#/components/schemas/CompanyInput'
      properties:
        id:
          type: integer
          nullable: true
          description: Update the company with this ID when provided.
        lookup:
          type: object
          nullable: true
          description: >-
            Optional lookup keys used when id is omitted. Keys are tried in this order:
            `crm_source`+`crm_import_id`, `vcard_uid`, `registration_number`, `company_name`+`email`
            (case-insensitive). The first key with exactly one match selects the company. A key with several
            matches fails the batch with 422 `invalid_item` and `error_details[].code = "ambiguous"`. When an
            external ID (`crm_source`+`crm_import_id`, `vcard_uid`, `registration_number`) is supplied but not
            found, the `company_name`+`email` match is used only if that company has no other ID of the same kind
            (for the CRM identity: no other `crm_import_id` of the same `crm_source`); otherwise the batch fails
            with 422 `invalid_item` and `error_details[].code = "conflict"` on `lookup.<key>`, and no company is changed.
            Several companies may share an email address; `company_name`+`email` is ambiguous when more than one
            company with that name uses the address, and no company is guessed or changed. Unique keys are `id`,
            the CRM identity (`crm_source`+`crm_import_id`), `vcard_uid` and `registration_number`.
            `GET /companies?email=` lists every owner of an address.
          properties:
            crm_source: { type: string, nullable: true }
            crm_import_id: { type: string, nullable: true }
            vcard_uid: { type: string, nullable: true }
            registration_number: { type: string, nullable: true }
            company_name: { type: string, nullable: true }
            email: { type: string, nullable: true }
