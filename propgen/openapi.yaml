    SearchProfileCatalogField:
      type: object
      required: [key, label, type, component, operators]
      properties:
        key: { type: string, example: buero_flaeche }
        label: { type: string }
        type: { type: string }
        component: { type: string }
        operators: { type: array, items: { type: string } }
        options:
          type: array
          items:
            type: object
            properties:
              value: {}
              label: { type: string }
              conditions: { type: array, items: {} }
              children: { type: array, items: { type: object } }
        conditions: { type: array, items: {} }
        section_conditions: { type: array, items: {} }
        input_props: { type: object, additionalProperties: true }
        source: { type: string }
    SearchProfileFilter:
      description: >-
        Numeric/currency/date criteria accept operator between with value {min,max}, or >= / <=
        with a scalar value. Legacy {min,max} and scalar forms remain supported. Select/multiselect
        criteria accept contains_any, contains_all or contains_none; booleans accept equals, including
        false. required=true makes a criterion mandatory for a match. The catalog supplies applicable
        operators. Optional weight (0, 1, 3, 5) and tolerance override the saved profile schema defaults.
        Weight 0 means filter only: the criterion is evaluated (required still excludes) but adds no
        points to the score numerator or denominator.
        Omit an override key in the submitted filter to reset it to the saved template default.
        Explicit tolerance: null disables tolerance, including geographic tolerance.
        GET returns effective weight and tolerance: GET-to-PUT is value-equivalent but may persist inherited
        defaults as explicit overrides. Unchanged disabled legacy criteria remain accepted on that roundtrip.
        Date tolerance type days is converted to elapsed seconds internally; absolute already means seconds
        on date fields and is never multiplied again. GET returns days for date tolerances.
        Tolerance never relaxes a required criterion.
        Derived flaeche resolves the object-type area and matches overlap with [teilbar_ab, main area].
        Without a valid teilbar_ab it compares the main area alone. A single requested value is between
        with equal min and max. Derived preis uses variant total (default), warm, per_sqm or sales_per_sqm.
        Purchase resolves to kaufpreis / kaufpreis_pro_qm_anlage; rent to kaltmiete / warmmiete /
        mietpreis_pro_qm_gewerbe. sales_per_sqm uses mietpreis_verkaufsflaeche for retail/hospitality rent.
        Unsupported object/marketing combinations or missing source values contribute zero; required
        derived criteria exclude those objects. Individual property criteria remain available.
        A radius criterion (radius_km) accepts one center {radius_km, lat, lng} or several search
        locations {locations: [{label, lat, lng, radius_km}, ...]}; it is saved as operator within_radius
        with value {locations: [...]}. An object matches when it lies within at least one radius;
        outside all radii the location with the nearest edge decides the tolerance. label names each
        place, so a separate search_location criterion is not needed. The single center remains valid;
        an incomplete or empty locations list drops the radius criterion.
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items: {}
        - type: object
          properties:
            operator: { type: string }
            value: {}
            min: {}
            max: {}
            equals: {}
            contains_any: { type: array, items: {} }
            contains_all: { type: array, items: {} }
            contains_none: { type: array, items: {} }
            locations:
              type: array
              description: Only valid on radius_km. Search locations, each with its own radius.
              items:
                type: object
                required: [lat, lng, radius_km]
                properties:
                  label: { type: string, description: Shown as the matched search location }
                  lat: { type: number }
                  lng: { type: number }
                  radius_km: { type: number, minimum: 0, exclusiveMinimum: true }
            required: { type: boolean, default: false }
            variant: { type: string, enum: [total, warm, per_sqm, sales_per_sqm], description: Only valid on preis. }
            weight: { type: integer, enum: [0, 1, 3, 5] }
            tolerance:
              type: object
              nullable: true
              required: [type, value]
              properties:
                type: { type: string, enum: [percent, absolute, days, radius_percent, radius_km] }
                value: { type: number, minimum: 0 }
