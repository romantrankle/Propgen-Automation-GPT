  /lookups/projects:
    get:
      summary: Project selection lookup
      description: Requires `projects.read`. Returns all active projects, ordered by title and ID. Optional parent_id restricts
        to direct children; an empty value returns roots.
      tags:
      - Lookups
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        parent_id:
                          type: integer
                          nullable: true
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      type:
                        type: string
                        enum:
                        - projects
        '401':
          description: Unauthorized
        '403':
          description: Missing scope
        '404':
          description: Record, parent or association not found in this shop
        '422':
          description: Invalid payload, hierarchy or cursor
      parameters:
      - name: parent_id
        in: query
        schema:
          type: integer
          nullable: true
  /automation_deployments:
    get:
      summary: List automation deployments
      description: Requires `automation_deployments.read`. Results are limited to the API key's shop and omit actor identifiers.
      responses:
        '200':
          description: Deployment history (at most 100, newest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationDeploymentListResponse' }
        '403': { description: Missing `automation_deployments.read` }
    post:
      summary: Deploy an exact automation draft revision
      description: 'Requires `automation_deployments.write`, and `automation_email.send` for plans using `email_draft.delivery_mode: send`. Send `Idempotency-Key` and exact `If-Match: "revision-N"`. Depending on shop policy, the deployment becomes active directly, remains pending_approval for a human decision, or is rejected.'
      parameters:
        - { $ref: '#/components/parameters/AutomationDraftIfMatch' }
        - { $ref: '#/components/parameters/AutomationIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomationDeploymentRequest' }
      responses:
        '201':
          description: Deployed directly
          content: { application/json: { schema: { $ref: '#/components/schemas/AutomationDeploymentResponse' } } }
        '202':
          description: Awaiting human approval
          content: { application/json: { schema: { $ref: '#/components/schemas/AutomationDeploymentResponse' } } }
        '412': { description: Stale revision }
        '428': { description: Missing If-Match }
  /automation_deployments/{id}:
    get:
      summary: Read an automation deployment
      description: Requires `automation_deployments.read`. Cross-shop IDs return 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Deployment
          content: { application/json: { schema: { $ref: '#/components/schemas/AutomationDeploymentResponse' } } }
        '404': { description: Not found }
  /automation_deployments/rollback:
    post:
      summary: Roll back to a historical revision
      description: 'Requires `automation_deployments.write`, and `automation_email.send` when rolling back to a plan using `email_draft.delivery_mode: send`. Send `Idempotency-Key`, exact `If-Match`, `automation_draft_id`, and historical `revision`. A rollback appends a new draft revision and deployment; history is never rewritten.'
      parameters:
        - { $ref: '#/components/parameters/AutomationDraftIfMatch' }
        - { $ref: '#/components/parameters/AutomationIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomationRollbackRequest' }
      responses:
        '201':
          description: Rollback revision deployed
          content: { application/json: { schema: { $ref: '#/components/schemas/AutomationDeploymentResponse' } } }
        '202':
          description: Rollback awaits human approval
          content: { application/json: { schema: { $ref: '#/components/schemas/AutomationDeploymentResponse' } } }
        '412': { description: Stale current revision }
        '428': { description: Missing If-Match }
  /automation_capabilities:
    get:
      summary: Discover supported automation plan capabilities
      description: Requires `automation_plans.read`. Returns the exact triggers, conditions, steps, references, limits, and safety policies supported by the current schema version.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      responses:
        '200':
          description: Versioned capability catalog. Includes a JSON Schema Draft 2020-12 in `data.plan_json_schema`.
          headers:
            ETag: { description: Private validator for conditional capability discovery, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationCapabilityResponse' }
        '304': { description: Capability catalog has not changed for this shop }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
  /automation_reference_types:
    get:
      summary: Discover semantic automation reference types
      description: Requires `automation_plans.read`. Every type names its selectors, lookup path, stable match states, sensitivity, and dependencies. Pipeline stages explicitly require a pipeline context.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '200':
          description: Stable reference type catalog
          headers:
            ETag: { description: Private validator for conditional discovery, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationReferenceTypeResponse' }
        '304': { description: Reference type catalog has not changed }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
  /automation_references/{type}:
    get:
      summary: Discover shop-local values for one reference type
      description: |
        Requires `automation_plans.read`. Lists values with opaque, shop-bound cursor pagination. Sensitive `user` and `mail_account` types require an exact selector and cannot be listed without selection. Supplying one selector (`key`, `name`, or `email`, where supported), or `query` across the type's advertised selectors, performs an exact, shop-scoped lookup and returns `not_found`, `unique`, or `ambiguous` in `meta.match_state`; ambiguous results intentionally return no candidate. Fuzzy name/text search is never emulated with SQL LIKE/ILIKE; entity text search remains on the canonical Elasticsearch search endpoints. `pipeline_stage` requires `pipeline`, containing the selected pipeline key or exact name.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [dashboard_phase, pipeline, pipeline_stage, task_category, mail_account, user, team, source, retention_reason, email_snippet, event_category, email_tag, contact_status, company_status, property_status, contact_tag, company_tag, property_tag, booking_page, note_label, note_tag, datenraum_template, newsletter_tag, project] } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor returned by this endpoint. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: query, in: query, schema: { type: string }, description: Exact lookup across the type's advertised semantic selectors. }
        - { name: key, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: email, in: query, schema: { type: string, format: email } }
        - { name: pipeline, in: query, schema: { type: string }, description: Required pipeline key or exact name for pipeline_stage. }
      responses:
        '200':
          description: Paginated values or exact-match state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationReferenceDiscoveryResponse' }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '422': { description: Unsupported type, selector/cursor error, unselected sensitive type (`selector_required_for_sensitive_type`), or missing/invalid pipeline context }
  /automation_recipes:
    get:
      summary: List declarative automation recipes
      description: Requires `automation_plans.read`. Recipes are stable facades over selected built-in blueprints and always compile email delivery to drafts.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      responses:
        '200': { description: Shop-aware recipe list }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
  /automation_recipes/{id}:
    get:
      summary: Fetch one declarative automation recipe
      description: Requires `automation_plans.read`. The path ID is the stable recipe key.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Recipe definition and required semantic references }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '404': { description: Recipe not found }
  /automation_plans/resolve:
    post:
      summary: Resolve and compile a declarative automation plan
      description: |
        Requires `automation_plans.validate`. Resolution is side-effect free and shop-scoped. Unknown capabilities return
        `valid: false` with a structured `capability_missing` issue; they are never approximated. Unknown input fields are errors.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/AutomationPlan' }
            example:
              plan:
                schema_version: '2026-08-26'
                external_key: consultant.deal.follow_up
                name: Deal nach Phasenwechsel nachfassen
                trigger:
                  type: deal_stage_changed
                  pipeline: { name: Vertrieb }
                  to_stage: { name: Qualifiziert }
                conditions:
                  - field: deal.to_stage
                    operator: equals
                    value: { name: Qualifiziert }
                steps:
                  - type: wait_for_deal_follow_up
                    duration: { value: 2, unit: hours }
                  - type: create_task
                    title: Deal nachfassen
                    creator: { email: consultant-owner@example.test }
      responses:
        '200':
          description: Resolution result; inspect `data.valid`, `data.issues`, and `data.capability_gaps`
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.validate` }
        '422': { description: Missing or malformed plan envelope }
  /automation_plans/dry_runs:
    post:
      summary: Safely dry-run a declarative plan
      description: Requires `automation_plans.dry_run`. No run, action output, email, task, note, or temporary automation is persisted. Interactive plans require `preview_user` and return `data.interactive_preview` with matched, failed, checks and the prepared action, evaluated with that user's permissions. This does not open a browser form. Updated events simulate changes to the root record's current values.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, root_entity]
              properties:
                plan: { $ref: '#/components/schemas/AutomationPlan' }
                root_entity:
                  $ref: '#/components/schemas/AutomationRootEntity'
                preview_user:
                  allOf: [{ $ref: '#/components/schemas/AutomationReference' }]
                  description: Required for interactive plans; email selector for a user in this shop. The root must be visible to this user.
      responses:
        '200': { description: Sanitized transient run and step results }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.dry_run` }
        '422': { description: Invalid plan or root entity; foreign IDs use the same not-found issue }
  /automation_plans/diff:
    post:
      summary: Compare two normalized automation plans
      description: Requires `automation_plans.read`. `against` must contain exactly one of `draft_id`, `external_key`, or `plan`. Stored comparisons use the shop-owned API draft's original plan.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, against]
              properties:
                plan: { $ref: '#/components/schemas/AutomationPlan' }
                against: { type: object, description: Exactly one comparison target }
      responses:
        '200': { description: Structural trigger, condition, and step differences with `identical` }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '404': { description: Stored draft not found in this shop }
        '422': { description: Invalid plan or comparison target; plan errors include the compiler resolution }
  /automation_plans/backtest:
    post:
      summary: Simulate a plan against recent shop records
      description: Requires `automation_plans.read`. Runs the dry-run simulator in rolled-back transactions. Schedule and webhook plans are unsupported. `sample_size` defaults to 5 and is clamped to 10.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/AutomationPlan' }
                sample_size: { type: integer, default: 5, maximum: 10 }
      responses:
        '200': { description: Per-record condition matches and redacted simulation steps, with aggregate meta }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '422': { description: Invalid plan or `backtest_not_supported` }
  /automations:
    get:
      summary: List all automations in the shop
      description: Requires `automations.read`. Results are ordered by `updated_at,id` descending. API-draft identifiers are visible shop-wide to keys with this scope; configuration graphs, trigger configuration, webhook tokens, and extension configuration are never returned.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: trigger_name, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [api, ui] } }
        - { name: external_key, in: query, description: Matches API drafts in the authenticated shop; unknown values return an empty page, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, description: Opaque cursor bound to the shop and API key, schema: { type: string } }
      responses:
        '200': { description: Cursor-paginated automation inventory }
        '401': { description: Unauthorized }
        '403': { description: Missing `automations.read` }
        '422': { description: "Invalid status, source, or cursor (`invalid_status`, `invalid_source`, `invalid_cursor`)" }
  /automations/{id}:
    get:
      summary: Read an automation with run statistics and provenance
      description: Requires `automations.read`. Cross-shop and unknown IDs return the same 404. Draft provenance and external keys are resolved by the authenticated shop and scopes; the creating API key is not an ownership boundary.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Safe automation detail
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/AutomationInventoryDetail' } } }
        '401': { description: Unauthorized }
        '403': { description: Missing `automations.read` }
        '404': { description: Automation not found in this shop }
  /automations/{id}/runs:
    post:
      summary: Start an API-managed manual automation
      description: Requires `automation_runs.execute` and `Idempotency-Key`. Only active API-managed automations with a manual trigger are accepted. Single-entity triggers require their configured `entity_type` and a shop-owned `entity_id`. Approval-gated starts are not available to API keys.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        '202':
          description: Redacted operation receipt with run ID
          content: { application/json: { schema: { $ref: '#/components/schemas/AutomationRunOperationResponse' } } }
        '403': { description: Missing `automation_runs.execute` }
        '404': { description: Automation or entity not found in this shop }
        '409': { description: Policy or idempotency conflict }
        '422': { description: Invalid input, missing idempotency key, or unsupported operation }
  /automation_drafts:
    get:
      summary: List API automation drafts in the shop
      description: Requires `automation_plans.read`. Draft visibility is scoped to the authenticated shop; the creating key is provenance, not an authorization boundary.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page. Cursors are bound to the authenticated shop and API key.
          schema: { type: string }
      responses:
        '200': { description: Inactive draft summaries ordered by `updated_at,id` descending; `meta.next_cursor` is present only when `has_more` is true }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '422': { description: "Invalid or manipulated cursor (`error: invalid_cursor`)" }
    post:
      summary: Create an idempotent inactive automation draft
      description: |
        Requires `automation_drafts.write` and an `Idempotency-Key` header. The key is unique per shop and API key.
        A replay with the same normalized plan returns the original draft and `Idempotency-Replayed: true`; different input returns 409.
        The resulting Automation is always `inactive`. It can be activated with the dedicated lifecycle scope.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/AutomationPlan' }
      responses:
        '201': { description: New inactive draft; ETag is `"revision-1"` }
        '200': { description: Idempotent replay }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_drafts.write` }
        '409': { description: Idempotency or external-key conflict }
        '422': { description: Invalid plan or missing idempotency key }
  /automation_drafts/{id}:
    get:
      summary: Fetch an automation draft
      description: Requires `automation_plans.read`. Returns the normalized plan, diagnostic compiled snapshot, provenance, and revision metadata. Scoped to the authenticated shop.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - $ref: '#/components/parameters/AutomationDraftId'
      responses:
        '200': { description: Draft detail with revision ETag }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '404': { description: Draft not found for this shop }
    patch:
      summary: Replace a draft plan using optimistic locking
      description: |
        Requires `automation_drafts.write` and `If-Match: "revision-N"`. `external_key` is immutable.
        An automation activated by a shop user can never be changed or deactivated through this endpoint.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - $ref: '#/components/parameters/AutomationDraftId'
        - $ref: '#/components/parameters/AutomationDraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/AutomationPlan' }
      responses:
        '200': { description: Updated inactive draft and next revision ETag }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_drafts.write` }
        '404': { description: Draft not found for this shop }
        '409': { description: Immutable external key or automation no longer inactive }
        '412': { description: Stale revision }
        '428': { description: If-Match required }
    put:
      summary: Replace a draft plan using optimistic locking
      description: |
        Requires `automation_drafts.write`.
        Same full-plan replacement contract and safety checks as PATCH. The complete `plan` is compiled
        and replaces the prior plan; omitted plan fields are not merged from the previous revision.
        Requires `automation_drafts.write` and `If-Match: "revision-N"`.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - $ref: '#/components/parameters/AutomationDraftId'
        - $ref: '#/components/parameters/AutomationDraftIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/AutomationPlan' }
      responses:
        '200': { description: Updated inactive draft and next revision ETag }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_drafts.write` }
        '404': { description: Draft not found for this shop }
        '409': { description: Immutable external key or automation no longer inactive }
        '412': { description: Stale revision }
        '428': { description: If-Match required }
    delete:
      summary: Delete an inactive draft and its linked automation
      description: Requires `automation_drafts.write`. Deletion is allowed only while inactive and only when no persisted run history exists. Success returns 204 with no body.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - $ref: '#/components/parameters/AutomationDraftId'
      responses:
        '204': { description: Draft and linked automation deleted }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_drafts.write` }
        '404': { description: Draft not found for this shop }
        '409': { description: "Automation is active (`draft_no_longer_inactive`) or has history (`runs_present` or `deployments_present`)" }
  /automation_drafts/by_external_key/{external_key}:
    get:
      summary: Fetch an automation draft by external key
      description: Requires `automation_plans.read`. Returns the same detail payload and revision ETag as the ID-based draft endpoint. Draft visibility is scoped to the authenticated shop; the creating API key is provenance, not an authorization boundary.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { name: external_key, in: path, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Shop-owned draft detail with revision ETag }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '404': { description: Draft not found for this external key in the authenticated shop }
    put:
      summary: Create or replace desired draft state by external key
      description: Requires `automation_drafts.write`. Creates with 201, updates with 200, and avoids a revision when the canonical plan is unchanged. No If-Match or Idempotency-Key is required.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { name: external_key, in: path, required: true, schema: { type: string, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { $ref: '#/components/schemas/AutomationPlan' }
      responses:
        '200': { description: Updated or unchanged draft; `meta.action` identifies the outcome }
        '201': { description: Created draft; `meta.action` is `created` }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_drafts.write` }
        '422': { description: Invalid plan or external-key mismatch }
  /automation_drafts/{id}/export:
    get:
      summary: Export a portable automation plan bundle
      description: Requires `automation_plans.read`. Returns the original plan and a shop-scoped semantic reference manifest; webhook tokens and compiled internals are excluded.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AutomationDraftId' }]
      responses:
        '200': { description: Schema version, original plan, reference manifest, and export timestamp }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '404': { description: Draft not found for this shop }
  /automation_drafts/{id}/activate:
    post:
      summary: Activate an inactive API-managed automation
      description: 'Requires `automation_drafts.activate`, and `automation_email.send` for plans using `email_draft.delivery_mode: send`. Strict transition from inactive to active; activation validates email action parameters and marks lifecycle management as API-controlled. Already active returns `already_active`.'
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AutomationDraftId' }]
      responses:
        '200': { description: Serialized active draft with revision ETag }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_drafts.activate` }
        '404': { description: Draft not found for this shop }
        '409': { description: Already active }
        '422': { description: "Model validation failed (`activation_failed`, with safe validation details)" }
  /automation_drafts/{id}/rotate_webhook_token:
    post:
      summary: Rotate a webhook automation token
      description: |
        Requires `automation_drafts.write` and a webhook-triggered draft. The response URL contains
        the newly generated full token exactly once; ordinary draft detail responses expose only a
        token preview and a redaction indicator.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AutomationDraftId' }]
      responses:
        '200':
          description: Fresh webhook URL and token metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [webhook]
                    properties:
                      webhook:
                        type: object
                        required: [url, token_preview, redacted]
                        properties:
                          url: { type: string, format: uri }
                          token_preview: { type: string }
                          redacted: { type: boolean, enum: [false] }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_drafts.write` }
        '404': { description: Draft not found for this shop }
        '422': { description: Draft does not use a webhook trigger }
  /automation_drafts/{id}/deactivate:
    post:
      summary: Deactivate an API-activated automation
      description: Requires `automation_drafts.activate`. Only automations previously activated through this API may be deactivated. UI-activated automations remain immutable and return `activation_not_api_managed`. To edit an active draft, deactivate it, PATCH it with If-Match, then activate it again.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AutomationDraftId' }]
      responses:
        '200': { description: Serialized inactive draft with revision ETag }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_drafts.activate` }
        '404': { description: Draft not found for this shop }
        '409': { description: "Already inactive or not API-managed (`already_inactive`, `activation_not_api_managed`)" }
  /automation_drafts/{id}/revisions:
    get:
      summary: List immutable draft revisions
      description: |
        Requires `automation_plans.read`. Scoped to the authenticated shop and ordered by revision ascending.
        List entries contain revision metadata and the normalized summary; `original_plan` and
        `compiled_snapshot` are served by the single-revision endpoint. Paginate with `limit`
        (default 50, maximum 100) and `after_revision`; `meta.next_after_revision` continues the list.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/AutomationDraftId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: after_revision, in: query, description: Only revisions greater than this number, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Revision metadata and normalized summaries with pagination meta }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '404': { description: Draft not found for this shop }
  /automation_drafts/{id}/revisions/{revision}:
    get:
      summary: Read one immutable draft revision
      description: Requires `automation_plans.read`. Includes the original plan and the diagnostic compiled snapshot.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/AutomationDraftId'
        - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Full revision }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_plans.read` }
        '404': { description: Draft or revision not found }
  /automation_drafts/{id}/stats:
    get:
      summary: Read seven-day run statistics for an automation draft
      description: Requires `automation_runs.read`. The draft and its run statistics are scoped to the authenticated shop.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - $ref: '#/components/parameters/AutomationDraftId'
      responses:
        '200':
          description: Run totals and daily counts for the last seven days
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AutomationRunStats' }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_runs.read` }
        '404': { description: Draft not found for this shop }
  /automation_runs:
    get:
      summary: List automation runs
      description: "Requires `automation_runs.read`. Unknown status values return 422 with `error: invalid_status`."
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - { name: automation_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: external_key, in: query, schema: { type: string } }
        - { name: status, in: query, description: Comma-separated run statuses, schema: { type: string } }
        - { name: dry_run, in: query, schema: { type: boolean } }
        - { name: revision, in: query, schema: { type: integer, minimum: 1 } }
        - { name: deployment_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: failure_code, in: query, schema: { type: string, enum: [run_timed_out, run_failed, step_failed] } }
        - { name: waiting_reason, in: query, schema: { type: string, enum: [approval_required, event_wait, execution_queued] } }
        - { name: correlation_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: latest_per_automation, in: query, schema: { type: boolean } }
        - { name: include_steps, in: query, description: When true, each run embeds redacted steps and the effective limit is capped at 50, schema: { type: boolean } }
        - { name: limit, in: query, description: Maximum 100, or 50 when include_steps=true, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Runs ordered by `created_at,id` descending with cursor pagination
          content: { application/json: { schema: { $ref: '#/components/schemas/AutomationRunListResponse' } } }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_runs.read` }
        '422': { description: Invalid status, timestamp, automation ID, or cursor }
  /automation_metrics:
    get:
      summary: Aggregate automation run metrics
      description: Requires `automation_metrics.read`. Uses SQL aggregation and is always scoped to the authenticated shop. The half-open `[from,to)` window is limited to 90 days; hourly buckets are limited to 7 days. At most three group dimensions may be combined.
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: interval, in: query, required: true, schema: { type: string, enum: [hour, day, week] } }
        - { name: group_by, in: query, description: "Comma-separated: automation, external_key, status, revision, deployment", schema: { type: string } }
      responses:
        '200':
          description: Totals and grouped time buckets. Durations exclude missing, negative, and over-30-day observations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [from, to, interval, group_by, totals, buckets]
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                      interval: { type: string, enum: [hour, day, week] }
                      group_by: { type: array, maxItems: 3, items: { type: string, enum: [automation, external_key, status, revision, deployment] } }
                      totals: { $ref: '#/components/schemas/AutomationMetricCounts' }
                      buckets:
                        type: array
                        items: { $ref: '#/components/schemas/AutomationMetricBucket' }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_metrics.read` }
        '422': { description: "`invalid_timestamp`, `invalid_time_range`, `time_range_too_large`, `invalid_interval`, `interval_too_small`, or `invalid_group_by`" }
  /automation_runs/{id}:
    get:
      summary: Read an automation run and its redacted steps
      description: Requires `automation_runs.read`. Raw context, input/output payloads, configuration snapshots, and graphs are never returned.
      tags: [Automations]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AutomationRun' }
        '401': { description: Unauthorized }
        '403': { description: Missing `automation_runs.read` }
        '404': { description: Run not found in this shop }
  /automation_runs/{id}/cancel:
    post:
      summary: Cancel a queued or persisted waiting run
      description: Requires `automation_runs.operate` and `Idempotency-Key`. Only queued, waiting, or pending-approval runs can be canceled. Running synchronous effects and terminal runs return `run_not_cancelable` (409).
      tags: [Automations]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        '202':
          description: Redacted operation receipt
          content: { application/json: { schema: { $ref: '#/components/schemas/AutomationRunOperationResponse' } } }
        '403': { description: Missing `automation_runs.operate` }
        '404': { description: Run not found in this shop }
        '409': { description: Run is not cancelable or idempotency conflict }
        '422': { description: Missing or invalid idempotency key }
  /webhooks:
