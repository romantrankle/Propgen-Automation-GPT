        '404': { description: Template not found in this shop }
  /letter_templates/{id}/generate:
    post:
      summary: Generate a document from a letter template
      description: |
        Requires `letter_templates.read`. Generation uses the same property merge context as the CRM UI.
        `user_id` selects the sender context. By default the property's primary active responsible user is used;
        if unavailable, the first active shop user by ID is used. Without `store_as_document`, the generated file
        is returned. With `store_as_document: true`, it is attached to the property and the response contains its ID.
        Set `async: true` for background generation, recommended for image-heavy documents. This returns 202
        with relative status/download URLs immediately. Missing Large image variants are prepared before rendering.
        Poll `status_url` (for example every 2 seconds, respecting rate-limit headers) until `completed` or `failed`.
        On completion, fetch `download_url`; with `store_as_document: true`, the status also contains `document_id`.
        Use the same API key for all requests. No browser session or Action Cable connection is required.
        Omitted `async` or `async: false` preserves synchronous behavior. A new POST starts a new document;
        to follow an accepted request, poll its status rather than resubmitting it.
      tags: [Letter templates]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id]
              properties:
                property_id: { type: integer }
                contact_id: { type: integer }
                company_id: { type: integer }
                company_location_id: { type: integer }
                output: { type: string, enum: [docx], default: docx }
                store_as_document: { type: boolean, default: false }
                async: { type: boolean, default: false }
                user_id: { type: integer }
      responses:
        '200':
          description: Generated DOCX
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        '201':
          description: Generated file stored as a property document
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [document_id, filename, content_type]
                    properties:
                      document_id: { type: integer }
                      filename: { type: string }
                      content_type: { type: string }
        '202':
          description: Background generation accepted (async true only)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status, status_url, download_url]
                    properties:
                      id: { type: integer }
                      status: { type: string, enum: [queued, preparing_images, rendering, completed, failed] }
                      company_location_id: { type: integer, nullable: true }
                      location_resolution:
                        type: object
                        nullable: true
                        properties:
                          stage: { type: integer }
                          reason: { type: string, enum: [explicit, relationship, single, headquarters, company_address] }
                          address_snapshot:
                            type: object
                            nullable: true
                            properties:
                              name: { type: string, nullable: true }
                              street: { type: string, nullable: true }
                              house_number: { type: string, nullable: true }
                              postal_code: { type: string, nullable: true }
                              city: { type: string, nullable: true }
                              address_supplement: { type: string, nullable: true }
                      status_url: { type: string, example: /public_api/v1/document_generations/123 }
                      download_url: { type: string, example: /public_api/v1/document_generations/123/download }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing letter_templates.read scope }
        '404': { description: Template not found in this shop }
        '422':
          description: Invalid property/user/output, corrupt template, generation error, or unavailable PDF conversion
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  message: { type: string }
                  template_errors:
                    type: array
                    description: Actionable DOCX command diagnostics when generation reaches the renderer.
                    items:
                      type: object
                      required: [command, reason]
                      properties:
                        command: { type: string }
                        reason: { type: string }
                        location:
                          type: object
                          properties:
                            part: { type: string }
                            paragraph: { type: integer }
                            offset: { type: integer }
                            length: { type: integer }
                            line: { type: integer }
                            column: { type: integer }
        '503': { description: Background generation could not be enqueued (generation_unavailable) }
  /document_generations/{id}:
    get:
      summary: Read background document generation progress and result
      description: |
        Requires `letter_templates.read` and the same API key that started the generation.
        Requests from another key or shop return 404. Authentication, IP restrictions and rate limits apply.
        `images_processed` counts checked/prepared images; `images_generated` counts newly created Large variants.
        `created_at` to `completed_at` includes queue time. `started_at` to `images_ready_at` covers image preparation.
        A failed job remains readable with status `failed`, error `generation_failed`, and available template diagnostics.
        `document_id` is non-null only for a stored result that has not subsequently been deleted.
      tags: [Letter templates]
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Generation status, including terminal failures
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string, enum: [queued, preparing_images, rendering, completed, failed] }
                      images_total: { type: integer }
                      images_processed: { type: integer }
                      images_generated: { type: integer }
                      store_as_document: { type: boolean }
                      document_id: { type: integer, nullable: true }
                      filename: { type: string, nullable: true }
                      content_type: { type: string, nullable: true }
                      company_location_id: { type: integer, nullable: true }
                      location_resolution:
                        type: object
                        nullable: true
                        properties:
                          stage: { type: integer }
                          reason: { type: string, enum: [explicit, relationship, single, headquarters, company_address] }
                          address_snapshot:
                            type: object
                            nullable: true
                            properties:
                              name: { type: string, nullable: true }
                              street: { type: string, nullable: true }
                              house_number: { type: string, nullable: true }
                              postal_code: { type: string, nullable: true }
                              city: { type: string, nullable: true }
                              address_supplement: { type: string, nullable: true }
                      error: { type: string, nullable: true, enum: [generation_failed, null] }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
                      started_at: { type: string, format: date-time, nullable: true }
                      images_ready_at: { type: string, format: date-time, nullable: true }
                      completed_at: { type: string, format: date-time, nullable: true }
                      template_errors:
                        type: array
                        items: { type: object }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing scope or disallowed IP }
        '404': { description: Generation not found for this key and shop }
        '429': { description: Rate limit exceeded; respect Retry-After }
