        gueltig_bis: { type: string, format: date, nullable: true }
        portal_fuehrend: { type: boolean, nullable: true, description: Portal exports transfer this certificate instead of the main one. }
      example:
        geltungsbereich: NICHTWOHNGEBAEUDE
        energieausweis_typ: BEDARFSAUSWEIS
        energieeffizienzklasse: F
        energiekennwert: 166.3
