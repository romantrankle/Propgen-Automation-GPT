openapi: 3.0.3
info:
  title: propgen Public API
  version: 1.0.0
  description: |
    Public API for propgen CRM integrations.
    Automation plan schema `2026-08-26` evolves additively; existing plan shapes retain their meaning.
    See the [executable automation integration guide](./automations-e2e.md) for credential rotation,
    desired state, strict deployments, operations, lifecycle webhooks, and rollback.

    ## Versioning & Deprecation

    Automation plans pin `schema_version`; additive capabilities do not change that version. Breaking
    changes would be introduced with a new schema version and announced at least 90 days before sunset
    through the changelog and, where applicable, the HTTP `Deprecation` header. The automation
    capabilities endpoint is the machine-readable source of truth for supported plan shapes.

    ## Authentication

    Use an API key generated in propgen CRM: **Settings → API-Schlüssel**.

    Provide the token in one of the following headers:

    - `Authorization: Bearer <api_key>`
    - `X-API-Key: <api_key>`

    Requests without a valid API key will return **401 Unauthorized**.
    If an API key has an IP allowlist, requests from other IPs will return **403 Forbidden**
    with error `ip_not_allowed`.

    An API key can optionally be assigned to a user from the same shop in
    **Settings → API-Schlüssel**. Search-profile template resolution then considers
    that user's and their teams' default assignments. This does not create a browser
    session or otherwise authenticate the request as that user. A deactivated assigned
    user remains effective until the assignment is changed; deleting the user clears
    the assignment and restores market-based resolution.

    User-bound keys additionally apply that user's view permission, team access and record
    permissions to contact list/detail reads and contact/company/property search. An inaccessible
    record is returned as `RestrictedEntity`: its ID, name/title, caretaker names and their teams,
    plus `restricted: true`. Other fields are **omitted**, including email, phone, address,
    timestamps, custom fields and associations, even with `fields=full` or `include`.
    Contact telephony search follows this rule and omits `matched_phone` for a restricted match.
    Keys without an assigned user remain shop-wide service keys governed by their existing scopes.
    No browser session is created. Other endpoint contracts and write scopes are unchanged.

    ## Permissions

    Every operation's description starts with **Requires …** and names the scopes the endpoint checks.
    It says whether one of the listed scopes is enough ("one of"), which one applies to the request
    ("if", "when"), or whether all of them are needed. A key without a required scope gets
    **403 Forbidden**, for example `{"error":"forbidden","missing_scope":"properties.read"}`;
    `missing_scope` names one scope or a list. The request log under **Settings → Integrationen →
    API-Schlüssel → Protokoll** masks response bodies, so read `missing_scope` from the response your
    integration received.

    Grant scopes in **Settings → Integrationen → API-Schlüssel**, pencil icon, section **Zugriffsrechte**. A scope
    `area.right` is the checkbox *right* in the group *area*: `list` = **Auflisten**, `read` = **Lesen**,
    `add` = **Anlegen**, `edit` = **Bearbeiten**, `delete` = **Löschen**. The search field also accepts
    the scope name, for example `properties.read`; group names are singular (**Immobilie**, not
    "Immobilien"). Groups and differently labelled rights in the editor:

    | Scope area | Group in the editor | Rights with their own label |
    |---|---|---|
    | `automations` | Automation Inventory | `automations.read` = **Automatisierungsbestand lesen** |
    | `automation_plans` | Automatisierungspläne | `automation_plans.read` = **Automatisierungsfunktionen und Entwürfe lesen**, `automation_plans.validate` = **Automatisierungspläne validieren**, `automation_plans.dry_run` = **Automatisierungspläne sicher testen** |
    | `automation_drafts` | Automatisierungsentwürfe | `automation_drafts.write` = **Inaktive Automatisierungsentwürfe schreiben**, `automation_drafts.activate` = **API-Automatisierungen aktivieren und deaktivieren** |
    | `automation_email` | Automatisierungs-E-Mails | `automation_email.send` = **E-Mail-Versand in API-Automatisierungen aktivieren** |
    | `automation_deployments` | Automatisierungs-Deployments | `automation_deployments.read` = **Deployment-Historie lesen**, `automation_deployments.write` = **Deployments und Rollbacks anfordern** |
    | `automation_runs` | Automatisierungsläufe | `automation_runs.read` = **Automatisierungsläufe lesen**, `automation_runs.execute` = **API-Automatisierungen manuell starten**, `automation_runs.operate` = **Wartende Automatisierungsläufe abbrechen** |
    | `automation_metrics` | Automatisierungskennzahlen | `automation_metrics.read` = **Automatisierungskennzahlen lesen** |
    | `form_definitions` | Formulare und benutzerdefinierte Felder | – |
    | `contacts` | Kontakt | – |
    | `companies` | Firma | – |
    | `tags` | Merkmale/Tags | – |
    | `statuses` | Status | – |
    | `sources` | Quellen | – |
    | `search_profiles` | Suchprofile | – |
    | `properties` | Immobilie | `properties.media` = **Objektmedien verwalten**, `properties.links` = **Objekt-Links verwalten** |
    | `property_images` | Objektbilder | `property_images.list` = **Objektbilder auflisten** |
    | `leases` | Mietverträge | – |
    | `projects` | Projekte | – |
    | `pipelines` | Pipelines | – |
    | `pipeline_columns` | Pipeline-Phasen | – |
    | `deals` | Deals | – |
    | `deal_attachments` | Deal-Dateien | – |
    | `tasks` | Aufgaben | – |
    | `task_categories` | Aufgabenkategorien | – |
    | `task_subtasks` | Teilaufgaben | – |
    | `task_attachments` | Aufgaben-Dateien | – |
    | `notes` | Notizen | – |
    | `note_labels` | Notiz-Kategorien | – |
    | `note_attachments` | Notiz-Dateien | – |
    | `calendar_events` | Kalendertermine | – |
    | `booking_pages` | Terminplaner | `booking_pages.read` = **Freie Termine abfragen** |
    | `bookings` | Terminbuchungen | `bookings.add` = **Termine verbindlich buchen** |
    | `event_categories` | Termin-Kategorien | – |
    | `activities` | Aktivitäten | – |
    | `phone_calls` | Telefonate | – |
    | `emails` | E-Mails | – |
    | `email_signatures` | E-Mail-Signaturen | – |
    | `shop_email_signatures` | Shop-Standardsignatur | – |
    | `account` | Kontodaten | – |
    | `account_assets` | Signatur-Bilder | – |
    | `legal_proofs` | Nachweise | – |
    | `datenraums` | Datenräume | – |
    | `document_activities` | Dokument-Aktivitäten | – |
    | `documents` | Dokumente | – |
    | `merge_fields` | Merge-Felder und Template-Syntax | `merge_fields.read` = **Merge-Felder und Template-Syntax lesen** |
    | `letter_templates` | Briefvorlagen | – |
    | `text_snippets` | Textbausteine | – |
    | `navigation_links` | Links in der Navigation | – |
    | `landingpage_templates` | Landingpage-Vorlagen (öffentliches HTML) | – |
    | `folders` | Ordner | – |
    | `webhooks` | Public API Webhooks | – |

    Scopes are independent. **Read does not imply list**. If you need list access,
    you must grant the `*.list` scope explicitly.
    The complete legacy property-image feed uses `property_images.list`. Property media CRUD uses the dedicated
    `properties.media` scope for listing, upload, metadata, ordering, and deletion. Property link CRUD uses the dedicated
    `properties.links` scope.

    ## Rate Limiting

    API keys can have a per-minute rate limit. When exceeded, requests return **429 Too Many Requests**
    with headers `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`, and `Retry-After`.

    Independent of that setting, every key is limited to **1,200 requests per minute** and every client IP
    address to **6,000 requests per minute**. After **20 requests with a missing or invalid key within one
    minute**, the IP address is blocked from the API for **10 minutes**, including requests with valid keys.
    These limits also return **429** with `Retry-After` (in seconds) and the body
    `{"error": "too_many_requests", "retry_after": …}`, but without the `X-RateLimit-*` headers.
    Pace bulk syncs and wait for `Retry-After` before retrying.

    ## Concurrency (ETag / If-Match)

    Detail endpoints return an `ETag` header. For updates, send the same value in `If-Match` to prevent
    lost updates. If the record has changed, the API responds with **412 Precondition Failed** and
    `error` = `etag_mismatch`.

    ## Booking appointments (phone assistants)

    Use an existing active booking page configured under **Calendar → Terminplaner**. Its numeric ID
    is the ID in the editor URL; it is not the public booking-link token. The page determines the
    owner, calendar account, duration, buffers, availability, notice, capacity and property.
    This API does not create booking pages or calculate arbitrary team availability.

    1. Grant `booking_pages.read` and `bookings.add` in the API-key editor. These scopes are independent
       of `calendar_events.*`; contact lookup/creation needs the existing contact scopes separately.
    2. `GET /booking_pages/{id}/available_slots?from=2026-09-08T00:00:00Z&to=2026-09-09T00:00:00Z`.
       Only complete slots inside this range and the page's current booking horizon are returned.
       Results are chronological, not paginated. Private blockers affect availability but their
       details and participant counts are never returned. A successful empty list means no slots.
    3. Choose a returned start/end pair and `POST /booking_pages/{id}/bookings` with
       `{"booking":{"contact_id":123,"slot_start":"2026-09-08T09:00:00+02:00","slot_end":"2026-09-08T09:30:00+02:00"}}`.
       Use an existing contact in the same shop. Object-specific pages link their configured property;
       general pages do not link a property. Caller-supplied property, owner and calendar overrides
       are not supported. Confirmation/notification and calendar synchronization use the normal
       booking workflow; `201` confirms CRM persistence, not external invitation delivery.

    Availability is not a reservation: creation checks it again under the booking locks. A slot
    that became unavailable returns `422 slot_unavailable`; fetch slots again before offering another.
    Do not use `POST /calendar_events` for this step: ordinary event creation does not enforce booking rules.
    The API allows at most one active future booking per contact/page. Retries do not replay the original
    response; an existing booking returns `422 slot_unavailable` or `422 validation_failed`, without a
    second booking. For an uncertain response, reconcile via the calendar-event list with contact filters
    (requires `calendar_events.list`) before choosing a different appointment.

    Availability uses the same calendar rules as the booking page: CRM blockers (including private,
    recurring and all-day busy events), and the resolved Microsoft/Google account for single appointments.
    The page editor currently supports explicitly selecting Microsoft accounts; an eligible Google
    account can be resolved by the existing owner-account fallback.
    Group/mass-viewing pages retain their existing CRM/capacity rules and do not query external free/busy.
    Provider failures must not be interpreted as a free calendar. Slot calculation failure returns
    `503 availability_unavailable`; a failure during final slot validation rejects creation with `422`.
    Neither this API nor a booking link can reserve time atomically inside an external calendar.

    ## Update semantics for associations

    `PATCH` and `PUT` on existing resources are partial updates. If an association field such as
    `contact_ids`, `company_ids`, `property_ids`, `project_ids`, `assignee_ids`, `label_ids`, or `tag_ids`
    is omitted, existing associations stay unchanged. Send an explicit empty array (for example
    `contact_ids: []`) only when you want to clear that association and the endpoint documents clearing.

    Dedicated `/{resource}/{id}/associations` endpoints replace only the submitted association keys;
    omitted keys stay unchanged. Notes are text notes, not phone-call resources; use `/phone_calls` for
    real phone-call records.

    ## Projects

    Projects support CRUD and one structural parent (`parent_id`). Setting `parent_id: null` moves a
    project to the root; omitting it preserves its parent. Parents and linked records must belong to
    the API key's shop. Cycles are rejected. DELETE soft-deletes only the selected project; it does
    not delete its children or linked CRM records. The creator is the shop's existing API actor
    (the first shop user), as with calendar events and pipelines.

    Use `project_ids` on contacts, companies, calendar events, tasks, deals and notes to set direct
    links. Omission preserves links; `[]` clears them. A note referencing both a contact and a project
    does not automatically link the contact to that project. Link the contact and event explicitly.
    `/projects/{id}/associations` manages contacts, companies, properties and deals; retrieve project
    notes and calendar events through their list endpoints with `project_ids`.

    Example webinar flow: list children with `GET /projects?parent_id=123`, reuse an existing child
    or create one with `{"project":{"title":"Webinar September","parent_id":123}}`, then send its ID
    as `project_ids` when creating/updating the contact, calendar event and note. The caller must
    reuse the child on subsequent runs; project titles are not unique and POST is not an upsert.
    `GET /projects?q=September&parent_id=123` searches titles via Elasticsearch. Search is eventually
    consistent and returns 503 when Elasticsearch is unavailable; the unsearched list reads the database.

    ## Error Format

    Errors are returned as JSON objects. Most endpoints respond with:

    ```json
    { "error": "forbidden", "missing_scope": "contacts.read" }
    ```

    Validation errors return:

    ```json
    {
      "error": "validation_failed",
      "errors": {
        "email": ["ist ungültig"],
        "phone_numbers": ["Diese Telefonnummer ist bereits vergeben."]
      },
      "error_details": {
        "email": [
          { "code": "INVALID_EMAIL", "message": "ist ungültig" }
        ],
        "phone_numbers": [
          { "code": "INVALID_PHONE_NUMBER", "message": "ist ungültig", "row_index": 0 }
        ]
      }
    }
    ```

    ## Agent-driven imports

    For repeatable migrations, use `crm_source` plus `crm_import_id` as the stable external identity.
    The pair is unique per shop and resource. Recommended order: upsert tags/statuses/sources, validate and
    apply company batches, validate and apply contact batches, then upsert search profiles. Contact/company
    batches and search-profile creates/updates (POST, PATCH, PUT) accept `validate_only: true`; validation executes the full transaction
    but rolls it back without webhooks or after-commit jobs.

    ## Search vs list

    `/search/*` endpoints are **not** general-purpose list APIs. They require a `q`/`query` string, use the same
    **read** scopes as the underlying entity (`contacts.read`, etc.), and return a small result set for picker UIs.
    Use the corresponding cursor-paged collection endpoints (e.g. `/contacts`) for full listing and sync.

    ## Cursor pagination (large list feeds)

    For major list endpoints, when Elasticsearch is available and the shop index contains documents,
    pagination uses an **opaque** `meta.next_cursor` tied to Elasticsearch **Point-in-Time** + `search_after`
    (stable ordering with an `id` tie-breaker). Cursors are **not** portable across sort parameters, `limit`,
    or between DB-only fallback and ES-backed pages. Reuse a cursor only with the **same** query string
    (except `cursor`).

    If Elasticsearch is unavailable or the index is empty for that entity, the API **falls back** to the
    legacy DB cursor format for the same routes (still opaque; do not mix with ES cursors).

    Invalid or expired cursors return **422** with `error: invalid_cursor`.

    ## Filtering

    List endpoints accept optional filters:

    - **Contacts**: `tag_ids`, `status_ids`, `archived`, `updated_since`, `email`
    - **Companies**: `tag_ids`, `status_ids`, `active`, `updated_since`, `email`
    - **Properties**: `einheitennummer`, `auftragsnummer`, `tag_ids`, `status_ids`, `user_ids`, `archived`, `updated_since`
    - **Leases**: canonical JSON `filters` array; exact `eq`/`in` filters for `status`, `property_id`, and
      configured scalar custom fields. Example: `filters=[{"field":"status","operator":"eq","value":"active"}]`.
    - **Deals**: `pipeline_id`, `pipeline_column_id`, `creator_id`, `archived`, `updated_since`, `created_since`,
      `closed_since`, `assignee_ids`, `contact_ids`, `company_ids`, `property_ids`
    - **Activities**: `activity_kind`, `item_type`, `item_id`, `actor_id`, `performed_from`, `performed_to`,
      `created_since`, `updated_since`, `contact_ids`, `company_ids`, `property_ids`
    - **Emails**: `direction`, `origin`, `owner_user_id`, `mail_account_id`, `source_id`, `tag_ids`,
      `contact_ids`, `company_ids`, `property_ids`, `created_since`, `updated_since`, `sent_since`, `received_since`
    - **Phone Calls**: `phone_integration_id`, `matched_contact_id`, `matched_company_id`, `matched_property_id`,
      `assigned_user_id`, `direction`, `state`, `created_since`, `updated_since`, `started_since`, `ended_since`
    - **Legal Proofs**: `contact_id`, `company_id`, `property_id`, `actor_id`, `recipient_email`,
      `created_since`, `consents_captured_since`, `confirmation_submitted_since`, `email_sent_since`
    - **Datenraums**: `status`, `property_id`, `company_id`, `template_id`, `contact_id`, `recipient_email`,
      `created_since`, `updated_since`
    - **Document Activities**: `contact_id`, `company_id`, `property_id`, `actor_id`, `template_id`,
      `context_type`, `created_since`, `updated_since`

    `tag_ids` and `status_ids` accept comma-separated IDs (OR within each list).
    Multiple filters are AND-combined. Boolean filters accept `true` or `false`.

    **Examples**

    - Kontakte mit Tag 5 oder 9, Status 12, nicht archiviert:
      `/contacts?tag_ids=5,9&status_ids=12&archived=false`
    - Unternehmen mit Status 7, aktiv:
      `/companies?status_ids=7&active=true`
    - Immobilien mit Tag 3, archiviert, seit Datum X geändert:
      `/properties?tag_ids=3&archived=true&updated_since=2025-01-15T10:00:00Z`

    ## Webhooks

    Webhooks are configured in propgen CRM under **Settings → API‑Webhooks**.
    Each event triggers a POST request with a JSON payload, regardless of where the change was made
    (CRM, mobile, booking pages, calendar sync, automations or this API). Bulk imports do not send webhooks.

    **Events**
    - `contacts.created`, `contacts.updated`, `contacts.deleted`
    - `companies.created`, `companies.updated`, `companies.deleted`
    - `properties.created`, `properties.updated`, `properties.deleted`
    - `deals.created`, `deals.updated`, `deals.deleted`
    - `tasks.created`, `tasks.updated`, `tasks.deleted`
    - `notes.created`, `notes.updated`, `notes.deleted`
    - `calendar_events.created`, `calendar_events.updated`, `calendar_events.deleted`
    - Backward compatible outcomes: `automation_run.completed`, `automation_run.failed`
    - Run lifecycle: `automation_run.started`, `.waiting`, `.approval_required`, `.skipped`, `.timed_out`, `.canceled`
    - Deployment lifecycle: `automation.deployment.requested`, `.approved`, `.rejected`, `.failed`, `.activated`, `.deactivated`, `.rolled_back`

    Automation lifecycle payloads contain only IDs, `external_key`, revision/deployment/run/correlation,
    status, a safe diagnosis and `occurred_at`. Plans, entity data and provider payloads are never included.
    Lifecycle subscriptions may set `filters.automation_id` or `filters.external_key`.
    - `webhooks.test` (test delivery only)

    **Signature**
    - Header: `X-propgen-Signature: t=<timestamp>,v1=<hmac_sha256>`
    - HMAC uses the webhook secret and the string: `<timestamp>.<raw_body>`
    - Additional headers: `X-propgen-Event`, `X-propgen-Delivery`, `X-propgen-Shop`

    **Verification (Node.js)**
    ```js
    import crypto from "crypto";

    const signature = req.headers["x-propgen-signature"]; // t=...,v1=...
    const secret = process.env.PROPGEN_WEBHOOK_SECRET;
    const [timestamp, hash] = signature.split(",").reduce((acc, part) => {
      const [key, value] = part.split("=");
      acc[key] = value;
      return acc;
    }, {});

    const payload = `${timestamp}.${rawBody}`;
    const expected = crypto.createHmac("sha256", secret).update(payload).digest("hex");
    const valid = crypto.timingSafeEqual(Buffer.from(hash), Buffer.from(expected));
    ```

    **Payload**
    ```json
    {
      "id": 123,
      "event": "contacts.updated",
      "resource": "contact",
      "occurred_at": "2025-01-15T10:00:00Z",
      "data": { ... }
    }
    ```

    `*.updated` deliveries contain `changed_fields`, a list of changed attributes (form fields as `section.field`),
    when the change touched recorded attributes. `*.deleted` deliveries contain the ID and the last known state.
    For calendar events, `data` additionally contains `category` and `contacts` with `id`, `name`, `email`
    and `phone_numbers`.

    For `properties.created` and `properties.updated`, `data` uses the full Property response without `images`.
    It always contains `parent_id`, which is `null` for detached properties and areals.
    ```json
    {
      "id": 456,
      "event": "properties.updated",
      "resource": "property",
      "occurred_at": "2026-08-29T10:00:00Z",
      "data": { "id": 456, "parent_id": 123 }
    }
    ```
servers:
  - url: /public_api/v1
tags:
  - name: Authentication
    description: API key based access.
  - name: Schema
    description: Dynamic form schemas per shop.
  - name: Lookups
    description: Lookup endpoints for select options.
  - name: Search
    description: Lightweight search endpoints for associations.
  - name: Webhooks
    description: Webhook events and payloads.
  - name: Documents
    description: Documents and uploads.
  - name: Navigation links
    description: Links shared in the left navigation with all users or selected teams.
  - name: Folders
    description: Document folders and hierarchy.
  - name: Contacts
    description: Contacts CRUD and sync.
  - name: Companies
    description: Companies CRUD and sync.
  - name: Properties
    description: Properties CRUD and sync.
  - name: Search Profiles
    description: Buyer/renter search criteria attached to contacts and companies.
  - name: Projects
    description: Project hierarchy and direct CRM record links.
  - name: Pipelines
    description: Pipelines and stages.
  - name: Pipeline Columns
    description: Pipeline stages.
  - name: Deals
    description: Deals and associations.
  - name: Deal Attachments
    description: Deal file uploads and downloads.
  - name: Tasks
    description: Tasks CRUD and status updates.
  - name: Task Categories
    description: Task categories list and management.
  - name: Task Subtasks
    description: Subtasks for tasks.
  - name: Task Attachments
    description: Task file uploads and downloads.
  - name: Notes
    description: Notes CRUD and associations.
  - name: Note Labels
    description: Note label management.
  - name: Note Attachments
    description: Note file uploads and downloads.
  - name: Calendar Events
    description: Calendar events CRUD and associations.
  - name: Event Categories
    description: Calendar event categories.
  - name: Activities
    description: Activity timeline entries.
  - name: Phone Calls
    description: Phone call records and associations.
  - name: Emails
    description: Email timeline items (list/read/create).
  - name: Email Signatures
    description: Centrally managed HTML email signatures for users.
  - name: Cost Centers
    description: >-
      Cost center catalog (Kostenstellen) of the organization's own legal entities, as kept in the billing system.
      Cost centers are deactivated with `active: false`; they cannot be deleted.
  - name: Invoice Service Types
    description: >-
      Billable service types (Leistungsarten) of the invoice preparation, i.e. the articles of the billing system with
      their article number per own legal entity. Deactivate with `active: false`; they cannot be deleted.
  - name: Payment Terms
    description: >-
      Payment terms (Zahlungskonditionen) with the key the billing system expects. Deactivate with `active: false`;
      they cannot be deleted.
  - name: Invoice Text Templates
    description: Header, footer and position text templates of invoices, one per invoice type.
  - name: Sales Agent Numbers
    description: >-
      Sales agent numbers (Vertriebler-Nummern) of users. Each number belongs to one legal entity and may name the
      cost centers of that legal entity it applies to; it never restricts which cost centers a user may work for.
  - name: Account
    description: Canonical account profile used by merge templates.
  - name: Tipster Tool
    description: |
      Settings of the tipster tool (Tippgeber-Tool) and its six tip types. Available only for accounts where
      propgen has unlocked the module; otherwise the endpoint answers `404`.
  - name: Account Assets
    description: Shop-scoped images for centrally managed email signatures.
  - name: Legal Proofs
    description: GDPR/legal proof records.
  - name: Datenraums
    description: Data room records.
  - name: Document Activities
    description: Generated document records.
  - name: Merge fields
    description: Surface-specific merge variables and template dialect contracts.
  - name: Automations
    description: Declarative automation planning for consultant integrations, including optional email delivery.
paths:
  /projects:
    get:
      summary: List projects
      description: Requires `projects.list`. Ordered by ID ascending, cursor-paged. q searches titles via Elasticsearch; keep
        q, parent_id and limit unchanged while paging. Search returns 503 if Elasticsearch is unavailable.
      tags:
      - Projects
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      has_more:
                        type: boolean
                      next_cursor:
                        type: string
                        nullable: true
        '401':
          description: Unauthorized
        '403':
          description: Missing scope
        '404':
          description: Record, parent or association not found in this shop
        '422':
          description: Invalid payload, hierarchy or cursor
        '503':
          description: Elasticsearch unavailable
      parameters:
      - name: parent_id
        in: query
        schema:
          type: integer
          nullable: true
        description: Omit for all projects; empty value returns root projects.
      - name: q
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
          minimum: 1
      - name: cursor
