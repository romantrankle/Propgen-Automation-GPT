    SearchProfileMatchResults:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SearchProfileMatch' }
        meta:
          type: object
          properties:
            limit: { type: integer }
            total_count: { type: integer, description: Number of eligible groups or standalone properties }
            has_more: { type: boolean }
            next_cursor: { type: string, nullable: true }
            score_threshold: { type: number }
    SearchProfileMatch:
      type: object
      description: >-
        Property values and score details refer to property_id. For a grouped unit
        match, id and name identify the group while all evaluated values come from
        the best eligible unit. Missing unit values inherit from its parent; explicit
        false and zero values are preserved. Scores are percentages, not probabilities.
      properties:
        id: { type: integer, description: Displayed group or standalone property ID }
        name: { type: string }
        property_id: { type: integer, description: Evaluated property or unit ID }
        parent_id: { type: integer, description: Immediate parent of the evaluated property; omitted for roots }
        matching_property_id: { type: integer, description: Best eligible unit ID for grouped unit results }
        default_send_property_id: { type: integer, description: Unit selected for property actions }
        score:
          type: number
          nullable: true
          description: Null when every scored criterion has weight 0 (filter only).
        score_tier: { type: string }
        score_label: { type: string }
        score_breakdown:
          type: array
          items:
            type: object
            properties:
              field_key: { type: string }
              field_label: { type: string }
              actual_value:
                description: >-
                  Effective unit value used for this criterion. For vermietbare_flaeche of a
                  divisible property (teilbar_ab above 0 and below the area) it is the compared
                  range from teilbar_ab up to the area, with the area in main_value and the
                  divisible-from value in teilbar_ab.
              comparator:
                type: object
                additionalProperties: true
                description: >-
                  Criterion operator and expected values. For a radius criterion with several search
                  locations it names the deciding location in location_label, with distance_km and
                  radius_km of that location.
              matched: { type: boolean }
              required: { type: boolean }
              weight: { type: number }
        failed_required:
          type: array
          items: { type: string }
          description: Field keys of violated required criteria
        matches_profile: { type: boolean, description: Present on unit rows; false means explanatory context only }
        field_values:
          type: object
          additionalProperties: true
          description: Displayed values keyed by field name
        variants:
          type: array
          items: { $ref: '#/components/schemas/SearchProfileMatch' }
        variants_count: { type: integer }
        has_variants: { type: boolean }
    SearchProfileInput:
      type: object
      description: >-
        Create/update payload for a contact or company search profile. `filters` accepts
        raw or normalized criteria; the server normalizes ranges and equality values
        according to the selected search profile template. On creation without
        search_form_template_id, an active template matching the contact/company
        target is selected by usage and object type from the positive filters,
        then usage alone, then the target default, then the first eligible template.
        On update, submitting nutzungsart, objektart, or sub_objektart in filters repeats
        that resolution and changes the template and schema snapshot when necessary.
        Updates without those market filters keep the current template. An explicit
        search_form_template_id always takes precedence. These rules also apply to
        CRM-identity upserts and validate_only requests. Whenever filters is submitted
        on an update, it replaces the complete saved criteria set; it is not merged with
        existing criteria. Integrations must therefore send every criterion they intend
        to retain. This replacement rule is identical for explicit and market-resolved
        template changes.
        Exclusion filters do not select a market default. New property criteria must be available in
        /search_profiles/catalog; context filtering affects the offered list, not saved values.
        On updates with the same template, saved schema metadata/version is preserved and only missing
        definitions are appended. Unlike the internal editing UI, this does not refresh template metadata.
        Existing disabled/excluded criteria may be retained with equivalent normalized values (including
        required) or removed; changed values are rejected.
      properties:
        crm_source: { type: string, nullable: true, description: Stable integration namespace; use together with crm_import_id. }
        crm_import_id: { type: string, nullable: true, description: Stable external profile ID; use together with crm_source. }
        name: { type: string, nullable: true }
        active: { type: boolean, nullable: true }
        valid_until:
          type: string
          format: date
          nullable: true
          description: >-
            Last valid day (inclusive). Omit on creation to inherit the template duration from today;
            null explicitly means unlimited. Omit on update to keep the date, including template changes.
            If the stored date is already past, setting today or a later date, or null, reactivates
            an unarchived profile unless the same request changes its active status.
            Resending active=false for an already inactive profile is not a status change and does not
            suppress this reactivation. An intentionally ended profile with a future date stays inactive.
        search_form_template_id: { type: integer, nullable: true }
        recipient_contact_id:
          type: integer
          nullable: true
          description: Optional contact id used as the expose recipient for this search profile.
        responsible_user_id:
          type: integer
          nullable: true
          description: >-
            Haupt-Betreuer (user id of the same account). On creation without a value, the Betreuer of the
            contact/company is used. On update, omit to keep the current value; null clears it.
        co_responsible_user_id:
          type: integer
          nullable: true
          description: >-
            Co-Betreuer (user id of the same account); must differ from responsible_user_id.
            Omit to keep the current value; null clears it.
        filters:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SearchProfileFilter' }
          example:
            city: Berlin
            vermarktungsart: KAUF
            kaufpreis:
              max: 650000
        internal_note: { type: string, nullable: true }
        public_note: { type: string, nullable: true }
        original_request_text: { type: string, nullable: true }
        extraction_metadata:
          type: object
          additionalProperties: true
    SearchProfileTemplate:
      type: object
      properties:
        id: { type: integer, nullable: true }
        name: { type: string }
        version: { type: integer }
        applies_to:
          type: string
          enum: [contacts, companies]
        resolved_by:
          type: string
          enum: [user, team, nutzungsart_objektart, nutzungsart, type_default]
          description: Resolution source on default-template responses.
        schema:
          type: object
          nullable: true
          description: >-
            Included on default-template responses and when `include=schema`.
            Field metadata default_required is a suggested Pflicht setting for new
            CRM profiles, not an API validation requirement. Explicit required flags
            in profile filters remain authoritative. Field priority is essential (weight 5),
            important (3), optional (1) or filter (0, evaluated for matching but not scored).
          additionalProperties: true
