  /properties/{id}/images:
    get:
      summary: List all property image records
      description: >-
        Requires `property_images.list`.
        Authenticated management feed requiring `property_images.list`. Unlike the website-safe images nested in full
        property responses, this returns every image record, including hidden, proof-only, processing, unattached, and
        non-image records. This includes the automatically generated location map (`media_tag: macro_location`, title
        `Lage`), which is unpublished by default. URLs refer only to the currently selected content (`current_version_id`);
        alternate content versions are never returned. Size URLs use existing variants and may fall back to the current
        original URL.
      tags: [Properties]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Complete ordered image management feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PropertyImageManagement' }
        '401': { description: Unauthorized }
        '403': { description: Missing property_images.list scope }
        '404': { description: Property not found in the API key shop }
  /properties/{id}/media:
    get:
      summary: List property media
      description: >-
        Requires `properties.media`.
        Returns all property photos and floorplans in their effective gallery order. Creating or changing property
        coordinates asynchronously creates or replaces one automatic `macro_location` image titled `Lage`, rendered
        with the location-map style configured for the shop. It is returned here with `publish_on_landingpage: false`;
        separately uploaded macro-location images are not replaced. Requires `properties.media`.
      tags: [Properties]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Ordered media list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PropertyImageManagement' }
        '401': { description: Unauthorized }
        '403': { description: Missing properties.media scope }
        '404': { description: Property not found in the API key shop }
    post:
      summary: Upload property media
      description: >-
        Requires `properties.media`.
        Uploads 1–20 images per multipart request, with a maximum size of 50 MB per file. Supported detected content
        types are JPEG, PNG, GIF, WebP, HEIC, and HEIF. Client-declared MIME types are not trusted. Optional `media`
        entries correspond by array index to `files`; `media_tag` takes precedence over `is_floorplan`. Uploads use the
        same stable storage, original-version, thumbnail, analysis, and deferred medium/large variant pipeline as UI uploads.
        Requires `properties.media` and emits `properties.updated` once after success.
      tags: [Properties]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: binary }
                media:
                  type: array
                  maxItems: 20
                  items: { $ref: '#/components/schemas/PropertyMediaMetadataInput' }
      responses:
        '201':
          description: Uploaded media
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PropertyImageManagement' }
        '401': { description: Unauthorized }
        '403': { description: Missing properties.media scope }
        '404': { description: Property not found in the API key shop }
        '422': { description: Missing file, invalid content, file too large, invalid metadata, or processing failure }
  /properties/{id}/media/order:
    put:
      summary: Replace the complete property media order
      description: >-
        Requires `properties.media`.
        `media_ids` must contain every current media ID exactly once. The resulting positions determine `einheit.bilder`
        and `einheit.bild1` through `einheit.bild9`; the first eligible non-floorplan is the title image. Requires
        `properties.media` and emits `properties.updated`.
      tags: [Properties]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_ids]
              properties:
                media_ids:
                  type: array
                  uniqueItems: true
                  items: { type: integer }
      responses:
        '200':
          description: Reordered complete media list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PropertyImageManagement' }
        '401': { description: Unauthorized }
        '403': { description: Missing properties.media scope }
        '404': { description: Property not found in the API key shop }
