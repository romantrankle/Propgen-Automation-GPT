  /search_profiles/catalog:
    get:
      summary: List available search-profile criteria
      description: >-
        Requires `search_profiles.read`. Returns the token shop's selectable property criteria,
        including custom fields explicitly enabled as searchable. Missing context dimensions
        are satisfied. Shorthand alternatives on one dimension are OR; structured conditions
        and all_of/any_of groups retain their meaning. Field and section conditions must match
        the same complete selection. Selected subtypes belong only to their parent object type.
        Context controls this offer, not the validity of already saved criteria.
        Copy canonical case-sensitive values from the schema options. Object types and subtypes
        accept a scalar (objektart=buero_praxen) or repeated bracket parameters
        (objektart[]=buero_praxen&objektart[]=einzelhandel&sub_objektart[]=PRAXIS).
        Option conditions and child hierarchies are returned for client-side option filtering.
      tags: [Search Profiles]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - { name: nutzungsart, in: query, schema: { type: string }, example: GEWERBE }
        - { name: vermarktungsart, in: query, schema: { type: string }, example: MIETE_PACHT }
        - name: objektart
          in: query
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
        - name: sub_objektart
          in: query
          schema:
            oneOf:
              - { type: string }
              - { type: array, items: { type: string } }
      responses:
        '200':
          description: Available criteria, without a contact or company identifier
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SearchProfileCatalogField' }
        '401': { description: Unauthorized }
        '403': { description: Missing search_profiles.read scope }
