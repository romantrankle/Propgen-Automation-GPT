    PropertyInput:
      type: object
      additionalProperties: true
      description: >-
        Property write payload. The API accepts the typed properties below plus all
        top-level fields from `/schema/properties/clean` (pricing, area, address,
        equipment, energy, marketing and custom shop fields). Unknown integration
        fields should use `custom_fields` or a `custom_*` top-level key; `custom_foo`
        is stored as `data.custom_fields.foo`. Unsupported top-level keys are rejected
        with `422` and named in `errors`. The `data` object is shallow-merged on update.
      properties:
        user_id: { type: integer, nullable: true, description: Primary responsible user from the same organization. }
        cost_center_id: { type: integer, nullable: true, description: "Active cost center of the organization from `/cost_centers`; submit `null` to clear." }
        objektart: { type: string }
        sub_objektart: { type: string, nullable: true }
        nutzungsart: { type: string }
        vermarktungsart: { type: string }
        aktion: { type: string, nullable: true }
        auftragsnummer: { type: string, nullable: true }
        einheitennummer: { type: string, nullable: true }
        archived: { type: boolean, nullable: true }
        parent_id:
          type: integer
          nullable: true
          description: >-
            Parent in the object hierarchy. Standard properties require a project parent; projects require an areal parent;
            areals cannot have a parent. The parent must belong to the same organization. Submit `null` to detach.
        landingpage_id:
          type: integer
          nullable: true
          description: >-
            Landingpage template override. Standard properties accept property or universal templates; projects and areals
            accept project or universal templates. The template must belong to the same organization. Submit `null` to clear.
        data:
          type: object
          description: Shallow-merged JSONB data; prefer typed top-level schema fields where possible.
          additionalProperties: true
        custom_fields:
          type: object
          description: Partner-defined fields merged into `data.custom_fields`.
          additionalProperties: true
        objekttitel: { type: string, nullable: true }
        strasse: { type: string, nullable: true }
        hausnummer: { type: string, nullable: true }
        plz: { type: string, nullable: true }
        ort: { type: string, nullable: true }
        bundesland: { type: string, nullable: true }
        land: { type: string, nullable: true, description: "ISO-3166-1-Alpha-2-Code aus der Länderliste des Shops (Standard: DE, AT, CH, NL, BE, FR). Ländernamen und Alpha-3-Codes („Deutschland“, „DEU“) werden als Code gespeichert; andere Werte werden mit 422 validation_failed abgelehnt; ein unveränderter Bestandswert bleibt gültig." }
        geolage_ids:
          type: array
          items: { type: integer }
        kaufpreis: { type: number, nullable: true }
        kaltmiete: { type: number, nullable: true }
        warmmiete: { type: number, nullable: true }
        wohnflaeche: { type: number, nullable: true }
        grundstuecksflaeche: { type: number, nullable: true }
        anzahl_zimmer: { type: number, nullable: true }
        anzahl_schlafzimmer: { type: number, nullable: true }
        anzahl_badezimmer: { type: number, nullable: true }
        baujahr: { type: integer, nullable: true }
        verfuegbar_ab: { type: string, nullable: true }
        vermietet: { type: boolean, nullable: true }
        urkundennummer: { type: string, nullable: true, description: Notarial deed number of a sale (KAUF). Returned in `data.verkauf.urkundennummer`; not shown on public pages. }
        kontaktperson_vorname: { type: string, nullable: true, description: First name of the portal contact person. Returned in `data.kontaktperson_portale.kontaktperson_vorname`. }
        kontaktperson_nachname: { type: string, nullable: true, description: Last name of the portal contact person. Once any portal contact field is set, the contact person replaces the main agent (Objektbetreuer) in OpenImmo and IDX exports. Returned in `data.kontaktperson_portale.kontaktperson_nachname`. }
        kontaktperson_email: { type: string, nullable: true, description: E-mail of the portal contact person. Returned in `data.kontaktperson_portale.kontaktperson_email`. }
        kontaktperson_telefon: { type: string, nullable: true, description: Phone of the portal contact person. Returned in `data.kontaktperson_portale.kontaktperson_telefon`. }
        preis_auf_anfrage: { type: boolean, nullable: true }
        objektbeschreibung: { type: string, nullable: true }
        lage: { type: string, nullable: true }
        ausstatt_beschr: { type: string, nullable: true }
        sonstige_angaben: { type: string, nullable: true }
        highlights:
          type: array
          description: Ordered highlight rows. Icon IDs use `standard:<slug>` or `shop:<id>`.
          items:
            $ref: '#/components/schemas/PropertyHighlight'
        energieausweis_geltungsbereich:
          type: string
          nullable: true
          enum: [WOHNGEBAEUDE, NICHTWOHNGEBAEUDE, null]
          description: >-
            Building part the main energy certificate (the other energy fields such as `energieausweis_typ`,
            `energieeffizienzklasse` and `energiekennwert`) covers. Returned in `data.energiepass`. When set, it
            selects the residential or non-residential class range instead of `nutzungsart`.
        weitere_energieausweise:
          type: array
          nullable: true
          description: >-
            Further energy certificates of a mixed-use building, e.g. the non-residential part of a residential and
            commercial building. Returned in `data.energiepass.weitere_energieausweise`. The submitted array replaces
            all rows; `[]` or `null` removes them; omit the key to keep them. Portal exports transfer exactly one
            certificate: the main one, or the row with `portal_fuehrend: true` (at most one row).
          items:
            $ref: '#/components/schemas/PropertyEnergyCertificate'
        tag_ids:
          type: array
          items: { type: integer }
        status_ids:
          type: array
          items: { type: integer }
        contact_associations_owners:
          type: array
          items:
            type: object
            properties:
              contact_id: { type: integer }
              custom_label: { type: string, nullable: true }
        company_associations_owners:
          type: array
          items:
            type: object
            properties:
              company_id: { type: integer }
              custom_label: { type: string, nullable: true }
        contact_associations_buyers:
          type: array
          items:
            type: object
            properties:
              contact_id: { type: integer }
              custom_label: { type: string, nullable: true }
        contact_associations_renters:
          type: array
          items:
            type: object
            properties:
              contact_id: { type: integer }
              custom_label: { type: string, nullable: true }
        contact_associations_associated:
          type: array
          items:
            type: object
            properties:
              contact_id: { type: integer }
              custom_label: { type: string, nullable: true }
        service_provider_relationships:
          type: array
          description: Explicit empty array clears service-provider relationships.
          items:
            type: object
            properties:
              entity_id: { type: integer }
              entity_type: { type: string }
              custom_label: { type: string, nullable: true }
              reciprocal_label: { type: string, nullable: true }
    PropertyEnergyCertificate:
      type: object
      description: One further energy certificate. Unknown keys are ignored.
      required: [geltungsbereich]
      properties:
        geltungsbereich: { type: string, enum: [WOHNGEBAEUDE, NICHTWOHNGEBAEUDE] }
        energieausweis_typ: { type: string, nullable: true, enum: [BEDARFSAUSWEIS, VERBRAUCHSAUSWEIS, null] }
