            `crm_source`+`crm_import_id`, `vcard_uid`, `kundennummer`, `email` (primary and additional
            addresses, case-insensitive). The first key with exactly one match selects the contact. A key
            with several matches fails the batch with 422 `invalid_item` and `error_details[].code = "ambiguous"`.
            When an external ID (`crm_source`+`crm_import_id`, `vcard_uid`, `kundennummer`) is supplied but not
            found, the `email` match is used only if that contact has no other ID of the same kind (for the CRM
            identity: no other `crm_import_id` of the same `crm_source`); otherwise the batch fails with 422
            `invalid_item` and `error_details[].code = "conflict"` on `lookup.<key>`, and no contact is changed.
            Several contacts may share an email address. A shared address in `lookup.email` therefore fails with
            `ambiguous`; no contact is guessed or changed. Unique keys are `id`, the CRM identity
            (`crm_source`+`crm_import_id`), `vcard_uid` and `kundennummer`. `GET /contacts?email=` lists every
            owner of an address.
          properties:
            crm_source: { type: string, nullable: true }
            crm_import_id: { type: string, nullable: true }
            vcard_uid: { type: string, nullable: true }
            kundennummer: { type: string, nullable: true }
