  /leases:
    get:
      tags: [Leases]
      summary: List leases
      description: Requires `leases.list`. Returns only leases belonging to the API key's shop. Pagination is ordered by `updated_at`, then `id`. Lease search is not indexed yet, so custom-field filters intentionally use strict exact scalar matching only.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor returned by the previous page }
        - name: filters
          in: query
          description: JSON array of canonical filter objects. Fields are `status`, `property_id`, or a configured scalar `custom_*` field; operators are `eq` and `in`. Unknown fields, operators, types, and status values return `invalid_filter`.
          schema: { type: string }
      responses:
        '200':
          description: Cursor-paged lease collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Lease' } }
                  meta: { $ref: '#/components/schemas/CursorMeta' }
        '401': { description: Missing or invalid API key }
        '403': { description: Missing leases.list scope or disallowed IP }
        '422': { description: Invalid filter or cursor }
    post:
      tags: [Leases]
      summary: Create a lease
      description: Requires `leases.add`. The property, contacts, and companies must belong to the API key's shop. Tenant associations are applied by the canonical Lease domain service. At least one active tenant is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease]
              properties: { lease: { $ref: '#/components/schemas/LeaseInput' } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Lease' } } } } }
        '401': { description: Missing or invalid API key }
        '403': { description: Missing leases.add scope or disallowed IP }
        '422': { description: Invalid payload, association, property, custom field, or lease validation }
  /leases/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Leases]
      summary: Get a lease
      description: Requires `leases.read`. Returns an ETag. Cross-shop and missing records both return 404.
      responses:
        '200':
          description: Lease
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Lease' } } } } }
        '401': { description: Missing or invalid API key }
        '403': { description: Missing leases.read scope or disallowed IP }
        '404': { description: Lease not found }
    patch:
      tags: [Leases]
      summary: Partially update a lease
      description: Requires `leases.edit`. Omitted fields, custom fields, contacts, and companies remain unchanged. Sending contacts or companies replaces that submitted tenant collection through the canonical Lease service. If-Match is optional; a stale value returns 412.
      parameters:
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [lease], properties: { lease: { $ref: '#/components/schemas/LeaseInput' } } } } }
      responses:
        '200':
          description: Updated lease
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Lease' } } } } }
        '403': { description: Missing leases.edit scope }
        '404': { description: Lease not found }
        '412': { description: ETag mismatch }
        '422': { description: Validation failed }
    put:
      description: Requires `leases.edit`.
      $ref: '#/paths/~1leases~1{id}/patch'
    delete:
      tags: [Leases]
      summary: Soft-delete a lease
      description: Requires `leases.delete`. The lease is retained as deleted data and excluded from list/show.
      responses:
        '204': { description: Soft-deleted }
        '403': { description: Missing leases.delete scope }
        '404': { description: Lease not found }

  /properties:
    get:
      summary: List properties
      description: >-
        Requires `properties.list`.
        Returns properties using cursor pagination. Default response is summary fields unless `fields=full` is provided.
        Full responses include only website-safe images; summary responses omit images.
        Filters are optional and AND-combined. `tag_ids`, `status_ids`, and `user_ids` accept comma-separated IDs
        (OR within each list). Example: `/properties?user_ids=149&archived=true&updated_since=2025-01-15T10:00:00Z`
        Requires the `properties.list` scope.
        For exact website/OpenImmo references, use `/properties?einheitennummer=8878` or
        `/properties?auftragsnummer=WEB-8878` instead of the fuzzy `/search/properties?q=8878` search.
        Numbers are matched as complete, case-sensitive strings without trimming or numeric conversion;
        leading zeros are significant. Both parameters together must match the same property.
        These lookups read current stored values without waiting for search indexing.
        The response remains a paginated list: use the returned `data[].id` for notes and tasks only
        when exactly one match exists (`data.length == 1` and `meta.has_more == false`). No match returns
        HTTP 200 with `data: []`; duplicate references return all matches, not an arbitrary first match.
        Soft-deleted properties remain excluded unless explicitly requested. GET `/properties/{id}` is unchanged.
      tags: [Properties]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: updated_since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [updated_at, created_at]
          description: Sort field for cursor pagination
