  /folders:
    get:
      summary: List folders
      description: |
        Requires `folders.list`.
        Returns the folder tree for the given entity as a **full array response**.
        This endpoint is intentionally **not cursor-paged**.
        Global folders are included by default.

        Example:
        - `/folders?entity_type=property&entity_id=42&include_global=false`
      tags: [Folders]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: entity_type
          in: query
          required: true
          schema:
            type: string
            enum: [contact, company, property]
          example: property
        - name: entity_id
          in: query
          required: true
          schema:
            type: integer
          example: 42
        - name: include_global
          in: query
          required: false
          schema:
            type: boolean
          example: false
      responses:
        '200':
          description: Folder tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Folder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Invalid entity_type
    post:
      summary: Create folder
      description: Requires `folders.add`. Creates a folder for the given entity (global folders are read-only in the API).
      tags: [Folders]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_type:
                  type: string
                  enum: [contact, company, property]
                entity_id:
                  type: integer
                name:
                  type: string
                parent_id:
                  type: integer
                  nullable: true
                metadata:
                  type: object
                  properties:
                    color: { type: string }
                    emoji: { type: string }
      responses:
        '201':
          description: Folder created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Folder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation errors
