        website: { type: string, nullable: true }
        email: { type: string, nullable: true }
        land: { type: string, nullable: true, description: "ISO-3166-1-Alpha-2-Code aus der Länderliste des Shops (Standard: DE, AT, CH, NL, BE, FR). Ländernamen und Alpha-3-Codes („Deutschland“, „DEU“) werden als Code gespeichert; andere Werte werden mit 422 validation_failed abgelehnt; ein unveränderter Bestandswert bleibt gültig." }
