        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /schema/{model}/clean:
    get:
      summary: Fetch clean schema for API integrations
      description: |
        Requires the read scope of the requested model: `contacts.read`, `companies.read`, `properties.read`, `deals.read`, `tasks.read`, `notes.read`, `calendar_events.read` or `emails.read`, matching `{model}`.
        Returns a compact schema without UI/layout metadata, optimized for API clients.

        Example flow:

        1) Fetch clean schema
        ```bash
        curl -H "Authorization: Bearer <api_key>" /public_api/v1/schema/contacts/clean
        ```
        2) Use dynamic sources from `input`
        ```bash
        curl -H "Authorization: Bearer <api_key>" /public_api/v1/lookups/contact_statuses
        curl -H "Authorization: Bearer <api_key>" "/public_api/v1/search/companies?q=acme"
        ```
      tags: [Schema]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
            enum: [contacts, companies, properties, deals, tasks, notes, calendar_events, emails]
      responses:
        '200':
          description: Clean schema payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
                  fields:
                    type: array
                    items:
                      type: object
                  available_fields:
                    type: array
                    items:
                      type: object
                  generated_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /contacts:
    get:
      summary: List contacts
      description: >-
        Requires `contacts.list`.
        Returns contacts using cursor pagination. Default response is summary fields unless `fields=full` is provided.
        Filters are optional and AND-combined. `tag_ids` and `status_ids` accept comma-separated IDs (OR within each list).
        Example: `/contacts?tag_ids=5,9&status_ids=12&archived=false&limit=50`
      tags: [Contacts]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: updated_since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [updated_at, created_at]
          description: Sort field for cursor pagination
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction (default asc)
        - name: include_deleted
          in: query
          required: false
          schema:
            type: boolean
            description: Include soft-deleted records
        - name: deleted_since
          in: query
          required: false
          schema:
            type: string
            format: date-time
            description: Return only soft-deleted records deleted since this timestamp
        - name: include
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated includes (tags,statuses,associations)
        - name: status_ids
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated status IDs (any match)
            example: "12,34"
        - name: tag_ids
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated tag IDs (any match)
            example: "5,9"
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
            example: false
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
            example: familie@example.com
          description: >-
            Returns every contact that owns this address as primary or additional email (exact match,
            case-insensitive, surrounding whitespace ignored). Several contacts may share one address, so the
            result can contain more than one contact; use the returned `id` to address a single contact.
        - name: fields
          in: query
          required: false
          schema:
            type: string
            enum: [summary, full]
        - name: include_deleted
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/ContactSummary'
                        - $ref: '#/components/schemas/Contact'
                        - $ref: '#/components/schemas/RestrictedEntity'
                  meta:
                    type: object
                    properties:
                      limit: { type: integer }
                      has_more: { type: boolean }
                      next_cursor: { type: string, nullable: true }
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Invalid cursor, updated_since, or fields
    post:
      description: Requires `contacts.add`.
      summary: Create contact
      tags: [Contacts]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contact:
                  $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailedResponse'
  /contacts/batch:
    post:
      summary: Batch upsert contacts
      description: >-
        Requires `contacts.add` if any item has no `id`, and `contacts.edit` if any item has an `id` or a `lookup`.
        Upserts multiple contacts in one request. If any item is invalid, the batch fails and no changes are applied.
        Requires `contacts.add` for new records and `contacts.edit` for items with `id` or `lookup`.
        Max batch size: 100. Set `validate_only=true` to execute and roll back the complete batch.
      tags: [Contacts]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                validate_only:
                  type: boolean
                  default: false
                contacts:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContactBatchItem'
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '412':
          description: ETag mismatch
        '422':
          description: Item validation error; the complete batch is rolled back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactBatchValidationFailedResponse'
