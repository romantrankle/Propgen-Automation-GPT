  /tipster_tool:
    get:
      summary: Read the tipster tool settings
      description: |
        Requires `tipster_tool.read`. Returns the tipster tool settings of the API key's shop and one entry per tip
        type in the fixed order `sale`, `valuation`, `rental`, `search_profile`, `buyer`, `tenant`. Settings and tip
        types are created with default values on first read. Answers `404` while propgen has not unlocked the module
        for the shop.
      tags: [Tipster Tool]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      responses:
        '200':
          description: Tipster tool settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      settings:
                        type: object
                        properties:
                          active: { type: boolean, description: Switched on by the account administrator. }
                          path: { type: string, nullable: true, description: 'Lowercase path of the tool address, unique across all accounts.' }
                          self_registration_enabled: { type: boolean }
                          approver_user_id: { type: integer, nullable: true, description: User who receives registration and profile approvals. }
                          priority_window_months: { type: integer, description: Tip priority window in months. }
                          visible_property_status_ids: { type: array, items: { type: integer }, description: Property statuses tipsters see in the property search. }
                          search_suggestions_enabled: { type: boolean }
                          invited_status_id: { type: integer, nullable: true, description: Contact status "Tippgeber (eingeladen)". }
                          registration_open_status_id: { type: integer, nullable: true, description: Contact status "Tippgeber (Registrierung offen)". }
                          active_status_id: { type: integer, nullable: true, description: Contact status "Tippgeber (aktiv)". }
                          deactivated_status_id: { type: integer, nullable: true, description: Contact status "Tippgeber (deaktiviert)". }
                          source_id: { type: integer, nullable: true, description: Source "Tippgeber". }
                          consent_document:
                            type: object
                            nullable: true
                            properties:
                              filename: { type: string }
                              content_type: { type: string }
                              byte_size: { type: integer }
                      tip_types:
                        type: array
                        items:
                          type: object
                          properties:
                            speichergrund_id:
                              type: integer
                              nullable: true
                              description: 'Account retention reason applied to the tipped contact, with the tip date as event date. Null means none (default). Equal or longer existing retention remains unchanged.'
                            tip_type: { type: string, enum: [sale, valuation, rental, search_profile, buyer, tenant] }
                            pipeline_id: { type: integer, nullable: true }
                            pipeline_column_id: { type: integer, nullable: true, description: Start phase of new tips. }
                            contact_status_ids: { type: array, items: { type: integer } }
                            contact_tag_ids: { type: array, items: { type: integer } }
                            property_status_ids: { type: array, items: { type: integer }, description: Applies to newly created properties only. }
                            property_tag_ids: { type: array, items: { type: integer }, description: Applies to newly created properties only. }
                            extra_fields:
                              type: array
                              items:
                                type: object
                                properties:
                                  entity: { type: string, enum: [contact, property, search_profile, deal] }
                                  field: { type: string }
                                  required: { type: boolean }
              example:
                data:
                  settings: { active: true, path: mustermann-immobilien, self_registration_enabled: false, approver_user_id: 12, priority_window_months: 18, visible_property_status_ids: [41, 42], search_suggestions_enabled: false, invited_status_id: 301, registration_open_status_id: 302, active_status_id: 303, deactivated_status_id: 304, source_id: 77, consent_document: null }
                  tip_types:
                    - { tip_type: sale, pipeline_id: 3, pipeline_column_id: 21, contact_status_ids: [], contact_tag_ids: [], property_status_ids: [], property_tag_ids: [], extra_fields: [{ entity: property, field: baujahr, required: true }] }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `tipster_tool.read` scope or source IP not allowed }
        '404': { description: Tipster tool not unlocked for the shop }
        '429': { description: API-key rate limit exceeded }
  /account:
    get:
      summary: Fetch the account profile
      description: |
        Requires `account.read`. Returns the canonical `konto` merge context for the API key's shop, including
        the effective legal-entity profile, logo URLs, Propstack-compatible address aliases, and an `assets`
        mapping keyed by account asset key. Manage the shop's default signature through `/account/email_signature`.
      tags: [Account]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      responses:
        '200':
          description: Canonical account profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `account.read` scope or source IP not allowed }
        '429': { description: API-key rate limit exceeded }
  /account/email_signature:
    get:
      summary: Read the shop default email signature
      description: Requires `shop_email_signatures.read`. Returns the stored HTML template for the token's shop.
      tags: [Email Signatures]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      responses:
        '200':
          description: Shop signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      shop_id: { type: integer }
                      html: { type: string }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing shop signature scope or source IP not allowed }
    put:
      summary: Set the shop default email signature
      description: |
        Requires `shop_email_signatures.edit`, granted through administrator-managed API keys.
        Uses the same signature sanitizer and merge-field rules as user signatures.
        For newly composed emails the precedence is mail account, composing user, then shop.
        Shared-mailbox owner signatures do not replace the composing user's signature.
        Changes do not rewrite existing drafts or sent messages. An empty string clears the shop default;
        omitted or null HTML is rejected. User and mail-account signatures remain untouched.
      tags: [Email Signatures]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email_signature]
              properties:
                email_signature:
                  type: object
                  required: [html]
                  properties:
                    html: { type: string }
      responses:
        '200': { description: 'Saved signature as data: {shop_id, html}' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing shop signature scope or source IP not allowed }
        '422': { description: Invalid signature payload }
  /account/assets:
    get:
      summary: List account assets
      description: Requires `account_assets.read`. Assets belong to the API key's shop and are ordered by key.
      tags: [Account Assets]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      responses:
        '200':
          description: Account asset list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountAssetListResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `account_assets.read` scope or source IP not allowed }
        '429': { description: API-key rate limit exceeded }
    post:
      summary: Upload or replace an account asset
      description: |
        Requires `account_assets.add`. Uploads must be PNG, JPEG, or safe SVG files. Posting an existing key
        replaces its current asset and returns a new permanent URL. The prior public file and URL are retained so
        signatures that have already been sent keep working.
        SVG support is limited to static shapes and paths; text, stylesheets, scripts, external references,
        and ID-based references such as `url(#gradient)` are not supported.
      tags: [Account Assets]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [key, file]
              properties:
                key:
                  type: string
                  pattern: '^[a-z_][a-z0-9_]*$'
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG, or SVG image.
      responses:
        '201':
          description: Uploaded or replaced account asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountAssetResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `account_assets.add` scope or source IP not allowed }
        '422':
          description: Missing file, invalid key, unsupported image type, or unsafe/invalid SVG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountAssetValidationError' }
        '429': { description: API-key rate limit exceeded }
  /account/assets/{key}:
    delete:
      summary: Delete an account asset
      description: |
        Requires `account_assets.delete`. If a user or mail-account signature references the asset's merge path
        or a current or retained URL, deletion returns `409 asset_in_use` with the references. Repeat with `confirm=true` to delete it.
        Deletion removes the current and retained files; already-sent messages using those URLs may lose their images.
      tags: [Account Assets]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z_][a-z0-9_]*$'
        - name: confirm
          in: query
          required: false
          description: Set to true to delete an asset referenced by a signature.
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Account asset deleted }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `account_assets.delete` scope or source IP not allowed }
        '404': { description: Asset key not found in the API key's shop }
        '409':
          description: Asset is referenced by one or more signatures and confirmation was not supplied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountAssetUsageConflict' }
        '429': { description: API-key rate limit exceeded }
  /users/{user_id}/email_signature:
    get:
      summary: Fetch a user's email signature
      description: |
        Requires `email_signatures.read`. The user must belong to the API key's shop; IDs can be discovered through
        `/lookups/users`. The response contains the stored sanitized HTML template. For personalization during email
        rendering, use the documented email merge fields such as `{{ absender.full_name }}`,
        `{{ absender.position }}` and `{{ konto.name }}`.
      tags: [Email Signatures]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Stored user email signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSignatureResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `email_signatures.read` scope or source IP not allowed }
        '404': { description: User not found in the API key's shop }
        '429': { description: API-key rate limit exceeded }
    put:
      summary: Replace a user's email signature
      description: |
        Requires `email_signatures.edit`. This operation replaces the complete user-level HTML signature. Send an
        empty `html` value to clear it. Unsafe elements, event attributes, URLs and CSS are removed using the same
        sanitizer as the propgen CRM signature editor; `text-transform` and `border-radius` are supported CSS properties.

        In an `img src` or `a href`, one URL merge expression is accepted with this exact shape:
        `[mailto:|tel:|http://|https://]{{ path [| default: 'literal' or "literal"] }}`. The prefix and `default`
        filter are optional, and the literal cannot contain braces. Allowed paths are `konto.logo_url`,
        `konto.logo_document_url`, `konto.logo_landingpage_url`, `konto.homepage_url`, `konto.instagram_url`,
        `konto.facebook_url`, `konto.linkedin_url`, `konto.assets.<key>.url`, `absender.avatar_url`,
        `absender.avatar_profile_url`, `absender.avatar_thumbnail_url`, `absender.email`, `absender.public_email`,
        `absender.mobil`, and `absender.phone`; asset keys match `[a-z_][a-z0-9_]*`. Empty or invalid rendered image
        URLs remove the image, while empty or invalid rendered link URLs remove only `href`. Unsafe schemes,
        unsupported filters, multiple expressions, and non-whitelisted paths remain rejected.
      tags: [Email Signatures]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailSignatureUpdateRequest' }
            example:
              email_signature:
                html: '<p>Viele Grüße<br><strong>{{ absender.full_name }}</strong><br>{{ absender.position }} · {{ konto.name }}</p>'
      responses:
        '200':
          description: Replaced and sanitized user email signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSignatureResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `email_signatures.edit` scope or source IP not allowed }
        '404': { description: User not found in the API key's shop }
        '422': { description: Missing or invalid request payload }
        '429': { description: API-key rate limit exceeded }
