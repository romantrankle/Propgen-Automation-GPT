  /contacts/{id}/search_profiles/{search_profile_id}/results:
    get:
      summary: Match properties for a contact search profile
      description: >-
        Requires `search_profiles.read` and `properties.read`. Returns live matches
        with score explanations. Each project's or areal's best eligible unit supplies
        the score, field values and property_id; id identifies the displayed group.
        parent_id is the matching unit's immediate parent (omitted for root properties).
        variants contains visible units ordered by score, including explanatory rows
        that fail required criteria or fall below min_score. Only variants with
        matches_profile=true qualify as matches; context rows never determine the group score.
        Profile status criteria and shop isolation apply. Properties holding a status the
        shop excludes from search profile matching are never returned. Cursor pagination counts groups.
        Reuse all query parameters with next_cursor; restart without a cursor after
        changing the profile or query. Score details are included in each result.
      tags: [Search Profiles]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: search_profile_id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: min_score
          in: query
          schema: { type: number, minimum: 0, default: 0.01 }
        - name: sort_by
          in: query
          description: score, updated_at, flaeche, preis, teilbar_ab or a numeric/date search-profile field key.
          schema: { type: string, default: score }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Matching groups or standalone properties, including score details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchProfileMatchResults' }
        '400': { description: Invalid cursor or unsupported sort field }
        '401': { description: Unauthorized }
        '403': { description: Missing search_profiles.read or properties.read scope }
        '404': { description: Contact or search profile not found in this shop }
        '422': { description: Archived or inactive search profile }
        '503': { description: Matching temporarily unavailable }
