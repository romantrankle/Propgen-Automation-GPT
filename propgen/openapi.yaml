          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            address: { type: string, nullable: true }
        company:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        recipient:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            email: { type: string }
            name: { type: string, nullable: true }
            contact_id: { type: integer, nullable: true }
        requires_otp: { type: boolean }
        requires_password: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }
        locked: { type: boolean }
        signature_status: { type: string }
        signature_required: { type: boolean }
        signature_signed_count: { type: integer }
        signature_required_count: { type: integer }
        signed_at: { type: string, format: date-time, nullable: true }
        views_count: { type: integer }
        form_completed:
          type: boolean
          description: |
            `true` once every recipient has submitted every fillable form block of the room (read-only forms
            do not count), also `true` for rooms without such a block. A form repeated per contact counts once
            per contact; a block shown only after a certain feedback answer counts only for recipients who gave
            it. Same value as in the app; list and detail endpoint.
        uploads_completed:
          type: boolean
          description: |
            `true` once every recipient has uploaded a file for every required upload slot, also `true` for
            rooms without required uploads. Optional slots do not count; per-contact and feedback-dependent
            blocks count as for `form_completed`. Same value as in the app; list and detail endpoint.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Datenraum:
      allOf:
        - $ref: '#/components/schemas/DatenraumSummary'
      properties:
        recipients:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              email: { type: string }
              name: { type: string, nullable: true }
              contact_id: { type: integer, nullable: true }
              role:
                type: string
                enum: [recipient, countersigner]
                description: |
                  `countersigner` is the user who countersigns for the sender's side. They sign only signature
                  blocks with `content.countersign`, after all other recipients, and the room is `signed` only
                  after them. They owe no answers, so they carry no `submission_status`. The room's `recipient`
                  is never the countersigner.
              first_viewed_at: { type: string, format: date-time, nullable: true }
              last_viewed_at: { type: string, format: date-time, nullable: true }
              submission_status:
                type: string
                nullable: true
                enum: [open, in_progress, submitted]
                description: Only in the detail endpoint with `fields=full`. This recipient's submission, see `submission_status` of the room.
              submitted_at:
                type: string
                format: date-time
                nullable: true
                description: Only in the detail endpoint with `fields=full`. Time of this recipient's last answer once the submission is complete.
        blocks:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              block_type: { type: string }
              position: { type: integer }
              content:
                type: object
                additionalProperties: true
              settings:
                type: object
                additionalProperties: true
        description: { type: string, nullable: true }
        project_ids:
          type: array
          items: { type: integer }
          description: Projects of the Datenraum. Taken from the email's assigned projects when the Datenraum is created from an email.
        first_viewed_at: { type: string, format: date-time, nullable: true }
        last_viewed_at: { type: string, format: date-time, nullable: true }
        submission_status:
          type: string
          nullable: true
          enum: [open, in_progress, submitted]
          description: |
            Submission of the answer blocks (feedback and declaration blocks). A recipient's submission is
            `submitted` once every answer block visible to them is answered, or 15 minutes after their last
            answer; `in_progress` before that; `open` without answers. The room is `submitted` as soon as one
            recipient has submitted. `null` for rooms without answer blocks and without answers.
            Only in the detail endpoint.
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Time of the last answer of the most recent completed submission; `null` while no submission is
            complete. Only in the detail endpoint.
        answers:
          type: array
          nullable: true
          description: |
            Answers of all recipients in the order they were given (forms, feedback and declaration blocks;
            uploads are not included). `null` when the key's user may not view data rooms.
            Only in the detail endpoint.
          items:
            type: object
            properties:
              id: { type: integer }
              type: { type: string, enum: [form, feedback, declaration] }
              block_id: { type: integer, nullable: true }
              block_type: { type: string, nullable: true, description: '`null` when the block was removed from the room.' }
              block_title: { type: string, nullable: true }
              recipient_id: { type: integer }
              contact_id:
                type: integer
                nullable: true
                description: Contact a form or feedback answer was given for, when the recipient chose one of several contacts.
              data:
                type: object
                additionalProperties: true
                description: |
                  The submitted values. Feedback: field id → value as configured in the block's `content.fields`
                  (structured feedback: `feedback_type`, `offer_type`, `offer_amount`, `note`, … with labels).
                  Declaration: `groups[]` with `id`, `label` and `options[]` (`id`, `label`, `checked`).
                  Form: `<model>.<field>` → value (e.g. `contact.first_name`), without fields the key may not read.
              created_at: { type: string, format: date-time }
        allow_downloads: { type: boolean, nullable: true }
        watermark_enabled: { type: boolean, nullable: true }
        signature_consent_key: { type: string, nullable: true }
        signatures:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              signer_name: { type: string, nullable: true }
              signer_email: { type: string, nullable: true }
              role: { type: string, enum: [recipient, countersigner], description: Whether the signature is a recipient's or the countersignature. }
              signed_at: { type: string, format: date-time, nullable: true }
              certificate_url: { type: string, nullable: true }
              evidence_pack_url: { type: string, nullable: true }
        signature_final_evidence_pack_url: { type: string, nullable: true }
    DocumentActivitySummary:
      type: object
      properties:
        id: { type: integer }
        template_id: { type: integer, nullable: true }
