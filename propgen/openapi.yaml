            schema:
              type: object
              properties:
                name: { type: string }
                file: { type: string, format: binary }
                category: { type: string, enum: [property_expose, letter, contract, report, other] }
                model: { type: string, enum: [property, contact, company] }
                description: { type: string }
                active: { type: boolean }
                position: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LetterTemplateResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing letter_templates.edit scope }
        '404': { description: Template not found in this shop }
        '422':
          description: Non-DOCX, corrupt DOCX, invalid metadata, or named merge-template findings
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidMergeTemplateResponse'
                  - type: object
    delete:
      summary: Delete a letter template
