  /properties/{property_id}/documents/order:
    put:
      summary: Save property document order
      description: |
        Requires `documents.edit`. Saves positions used by the CRM, landingpage and data room.
        Supply `ids` with every non-global document of the property exactly once, or use
        `sort_by` with `folder_id` to sort all property documents in one folder.
        Omit `folder_id` or use null for documents without a folder. Other folders keep their relative
        order. Global documents are never changed. Alphabetical sorting uses the display name,
        ignoring case and accents; upload date uses `created_at`.
        Read saved positions via `GET /documents?entity_type=property&entity_id=42&include_global=false`.
      tags: [Documents]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - name: property_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                sort_by:
                  type: string
                  enum: [name_asc, name_desc, uploaded_asc, uploaded_desc]
                folder_id: { type: integer, nullable: true }
            examples:
              alphabetical:
                value: { sort_by: name_asc, folder_id: 12 }
              manual:
                value: { ids: [23, 21, 22] }
      responses:
        '200':
          description: Saved document order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      property_id: { type: integer }
                      ids:
                        type: array
                        items: { type: integer }
        '401': { description: Unauthorized }
        '403': { description: Missing documents.edit scope }
        '404': { description: Property not found }
        '422': { description: Invalid sort or incomplete, duplicate or foreign document IDs }

