  /form_definitions:
    get:
      summary: Discover supported form-definition models
      description: Requires `form_definitions.read`. Returns the bounded model collection and contract version.
      security: [{ BearerAuth: [] }, { ApiKeyHeader: [] }]
      responses:
        '200':
          description: Supported form-definition models
          content:
