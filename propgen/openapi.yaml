  /booking_pages/{id}/available_slots:
    get:
      summary: Read available booking slots
      description: >-
        Requires `booking_pages.read`. Uses the existing active booking page's availability rules.
        Both bounds are required ISO 8601 timestamps with timezone offsets. Only slots whose start
        is at or after `from` and end is at or before `to` are returned. This does not reserve a slot.
      tags: [Bookings]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Chronological available slots; an empty array means none are available
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [start, end]
                      properties:
                        start: { type: string, format: date-time }
                        end: { type: string, format: date-time }
              example:
                data:
                  - { start: '2026-09-08T09:00:00+02:00', end: '2026-09-08T09:30:00+02:00' }
        '401':
          description: Missing or invalid API key
        '403':
          description: Missing scope or IP not allowed
        '404':
          description: Booking page not found in the API key's shop
        '422':
          description: '`invalid_range` (missing/invalid bounds or to ≤ from), or `booking_page_inactive`'
        '429':
          description: API key rate limit exceeded
        '503':
          description: '`availability_unavailable`; availability could not be calculated, not an empty calendar'
  /booking_pages/{id}/bookings:
    post:
      summary: Book an available appointment for an existing contact
      description: >-
        Requires `bookings.add`. Submit an exact start/end pair from the available slots endpoint.
        Uses the normal booking workflow and revalidates under locks. The contact must belong to the
        same shop. The page determines the property, owner and calendar. At most one active future
        booking per contact/page; retries reject rather than replaying a prior response. Does not
        support arbitrary calendar events, changing bookings, or bypassing booking-page rules.
      tags: [Bookings]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking]
              properties:
                booking:
                  type: object
                  required: [contact_id, slot_start, slot_end]
                  properties:
                    contact_id: { type: integer }
                    slot_start: { type: string, format: date-time }
                    slot_end: { type: string, format: date-time }
            example:
