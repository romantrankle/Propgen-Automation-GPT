              schema: { $ref: '#/components/schemas/SalesAgentNumbersResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `sales_agent_numbers.read` scope or source IP not allowed }
        '404': { description: User not found in the API key's organization }
    put:
      summary: Replace a user's sales agent numbers
      description: >-
        Requires `sales_agent_numbers.edit`. Replaces the complete list; send an empty array to remove all numbers.
        A number is unique per legal entity. `cost_center_ids` is optional and must name cost centers of the same
        legal entity. The list is replaced atomically: on a validation error nothing changes.
      tags: [Sales Agent Numbers]
      security:
        - BearerAuth: []
        - ApiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sales_agent_numbers]
              properties:
                sales_agent_numbers:
                  type: array
                  items: { $ref: '#/components/schemas/SalesAgentNumberInput' }
            example:
              sales_agent_numbers:
                - { number: V3004, legal_entity_id: 1, cost_center_ids: [12] }
                - { number: V4006, legal_entity_id: 1, cost_center_ids: [14] }
      responses:
        '200':
          description: Replaced sales agent numbers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesAgentNumbersResponse' }
        '401': { description: Invalid or missing API key }
        '403': { description: Missing `sales_agent_numbers.edit` scope or source IP not allowed }
        '404': { description: User not found in the API key's organization }
        '422': { description: Missing list, duplicate number, unknown legal entity, or cost center of another legal entity }
